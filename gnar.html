<title>Powder Run · G.N.A.R.</title>
<!--
  gnar.html — the game (built Sep 10 2026, ships in version 69.69.69)

  WHAT IT IS
  A points game for the four full-trip riders, inspired by the original G.N.A.R. (Gaffney's Numerical
  Assessment of Radness). The structure is the book's — line worth + line extras + trick − crash penalties
  = a line score; line scores + every other extra − every other penalty = your GNAR Factor. The items are
  ours: every run, bar, sight and stash below is a real name from trip-data.json.

  HOW IT IS WIRED
  - Its own page, like 3d.html and mark.html. The scoring maths (votes, props, totals) sit in
    gnar-score.js, which index.html also loads for the Home-tab scoreboard card — one copy, so the two
    boards can never disagree. This page adds the item list and the claim UI on top.
  - Same gate as the app: the trip name + password the phone already saved (localStorage gname / gpw)
    unlock trip-data.json with the app's own recipe (PBKDF2, 150,000 rounds → AES-GCM). The code below is
    a copy of gateTry() in index.html.
  - Players = the crew members whose "legs" say "Full trip". Your own name comes from localStorage 'me',
    which the app's Crew picks form already sets. Not set yet → the page asks once.
  - The scoreboard is shared through the same Google Apps Script the Runs & spots tab uses (D.runsUrl).
    New: a "gnar" sheet tab. GET ?gnar=1 lists every claim; POST {action:'gnar', …} adds one.
    See 04-app-build/powder-run-apps-script.gs and 04-app-build/gnar/README.md.
  - No signal on the hill: every claim is written to this phone first (localStorage 'gnar-queue') and
    pushed to the sheet when the phone is back online. Each claim carries its own id, so a re-send never
    makes a duplicate. What you see on the board = the sheet's list + this phone's unsent claims (tagged
    "not uploaded yet"). Retries are quiet and back off (section 5b).
  - Since Sep 24 2026 every request to the sheet script carries the crew token k (gnarCrewToken in
    gnar-score.js). A "locked" answer keeps the phone's copy and shows "tell Tanner".
  - A "ski day" runs 3 am to 3 am, so a claim logged at 12:30 am after the meeting lands on the right day.

  CHANGING THE GAME
  Every item lives in the ITEMS list below (code, group, name, detail, points, how often). Where it shows on
  the Claim tab (which pill, which head, next to what) is the LAYOUT block right after ITEMS — put a new code
  there too, or it lands in "More" under Crew. Edit the number,
  encrypt nothing (this page holds no secrets), commit, push. Vote points and the Super Bowl props are in
  gnar-score.js. 04-app-build/gnar/README.md walks through it.
-->

<div class="between" style="align-items:flex-start">
  <div><h1>G.N.A.R.</h1><div class="sub" id="intro">Gaffney's Numerical Assessment of Radness — Powder Run edition. Four players, one board.</div></div>
  <a class="btn" href="index.html" style="margin-top:4px;white-space:nowrap">‹ App</a>
</div>
<div class="stripe"></div>
<div id="mecard"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="pane" id="pane"></div></div>
<div id="toast"></div>
<div class="gate" id="gate"><div class="card"><h1>Powder Run · G.N.A.R.</h1><div class="sub" id="gsub">Opening the board…</div><div id="gform" style="display:none">
  <div class="xs muted">Trip name</div><input class="inp" id="gname" autocomplete="off" placeholder="the trip name">
  <div class="xs muted">Trip password</div><input class="inp" id="gpw" type="password" placeholder="password">
  <button class="btn pri wide" id="gok">Unlock</button></div>
  <div class="err" id="gerr"></div></div></div>

<script src="gnar-score.js"></script>
<script src="gnar-data.js"></script>
<script>
/* =====================================================================================
   1. THE GAME — every item, in one list. Edit numbers here.
   Fields: c = code (never reuse one; the sheet stores it)   g = group   r = resort id (lines only)
           n = name   d = the fine print   p = points (negative = penalty)
           f = how often: day (once per ski day) · daily · nightly · once (per trip) · resort (once per
               resort) · unl (unlimited) · max3 / max5 (per night / per trip, honour system)
           s = 'ski' | 'board' when a row is one side only   sub = 'crash' for the penalties that
               can be ticked inside a line claim   o = lines only: the honest odds it's open in February
           st = 1 marks a "storied" line (famous, not hard — the story is in d)
   Groups: line (per resort) · set (several lines in one day, scored as one) · lx (line extras) · trick ·
           hill · prep (daily discipline) · town (business meetings) · road (roadside sights) ·
           stick (sticker hunt) · bonus (the stupid bonuses) · pen (penalties)
   The line worths come from the Sep 10 research pass — every number has its reasons and sources in
   04-app-build/gnar/_dig/<resort>.md. Reddit (r/skiing) reviewed the first list; the dig answered it.
   ===================================================================================== */
/* ITEMS, RULES, GROUPS and LAYOUT now live in gnar-data.js (loaded above). Edit them with 04-app-build/gnar/GNAR-EDITOR.html. */
/* The nightly votes are not items you claim — they are cast on the board. VOTE_PTS lives in gnar-score.js. */
/* Witness rule: lines 7+ and extras 5+ need a crew name on the claim. Penalties never do. */
function needsWitness(it){ if(it.p<=0)return false; return it.g==='line'?it.p>=7:it.p>=5; }   /* sets, extras, bonuses: 5+ */
/* The rules card, in the app's voice. */
/* =====================================================================================
   1b. WHERE THINGS SHOW ON THE CLAIM TAB (Sep 11 2026)
      Six pills. Under each, a few heads; inside a head, items sit in the order written here —
      a penalty right under the bonus it undoes (first chair → missed first chair). This is
      display only: scoring still uses each item's g. The same code can sit under two heads
      (curling is under Golden and under Party — same item, same once rule, two doorways).
      A new item with points that is not listed here lands in "More" at the bottom of Crew,
      so it is never lost — but put it where it belongs.
      Hills: the resort chips stay. Under a hill it reads lines → storied → sets → "Also at
      <hill>" (that hill's own stuff + the per-resort ones) → the three any-day heads,
      collapsed by default (tap the head; it stays open as you move between hills).
   ===================================================================================== */
var GROUP_TINT={line:'terrain',set:'terrain',hill:'snow',prep:'money',town:'meeting',road:'',stick:'todo',bonus:'stash',pen:'alertcard'};
var ICONS={ /* the app's own icon set, same paths as index.html */
 trees:'<path d="M8.4 3.2 12.4 9.6H4.4L8.4 3.2Z"/><path d="M8.4 7.2 13.2 14.8H3.6L8.4 7.2Z"/><rect x="7.4" y="14.8" width="2" height="3.2"/><path d="M17 8.4 20.2 13.6h-6.4L17 8.4Z"/><path d="M17 11.2 20.8 17.2h-7.6L17 11.2Z"/><rect x="16" y="17.2" width="2" height="2.6"/>',
 mountain:'<path fill-rule="evenodd" d="M8.7 3.6 13 10.6l2.3-3.6 7 12H1.7L8.7 3.6Zm0 3 1.9 3.1-1.1-.8-1.2 1.2-1.1-1.1-1 .8 2.5-3.2Z"/>',
 snowflake:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.8v18.4M4 7.4l16 9.2M20 7.4 4 16.6"/><path d="M12 6.4 9.9 4.3M12 6.4l2.1-2.1M12 17.6l-2.1 2.1M12 17.6l2.1 2.1M6.6 8.9l-2.9-.5M6.6 15.1l-2.9.5M17.4 8.9l2.9-.5M17.4 15.1l2.9.5"/></g>',
 car:'<path fill-rule="evenodd" d="M2.2 8.2a1.3 1.3 0 0 1 1.3-1.3h8.1a1.3 1.3 0 0 1 1.3 1.3v7.2H2.2V8.2Zm11.6.8h3.1a1.4 1.4 0 0 1 1.1.6l2.4 3.2a1.6 1.6 0 0 1 .3 1v1.6h-6.9V9Zm1.5 1.5v2.4h3.7l-1.8-2.4h-1.9Z"/><circle cx="6.2" cy="17.2" r="2.2"/><circle cx="16.9" cy="17.2" r="2.2"/><g fill="none" stroke="currentColor" stroke-linecap="round"><path stroke-width="1.8" d="M12.6 3H4.1a2 2 0 0 1-1.9-1.3"/><path stroke-width="1.8" d="M12.6 5.6H3.3a2 2 0 0 1-1.9-1.3"/></g>',

   2. SMALL HELPERS
   ===================================================================================== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
/* jsq(s) — free text (a name, a claim id) as a JS string argument inside an onclick="f('…')" (audit m6).
   esc() alone is not enough: the browser turns &#39; back into ' before the JS runs, so a name like
   O'Brien would end the string early. So: backslash-escape \ and ' (and line breaks) first, then esc(). */
function jsq(s){ return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')); }

function normName(x){return (x||'').toLowerCase().split(/\s+/).filter(Boolean).join(' ');}
function b64d(x){var b=atob(x),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function uid(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }

function getNow(){ try{ var t=localStorage.getItem('testNow'); if(t)return new Date(t); }catch(e){} return new Date(); }
/* A ski day runs 3 am → 3 am, so 12:30 am after the meeting still counts as tonight. */
function skiDay(d){ d=d||getNow(); var x=new Date(d.getTime()-3*3600*1000); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function fmtDay(s){ var d=new Date(s+'T12:00:00'); return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }

/* =====================================================================================
   3. THE GATE — same recipe as index.html gateTry(). trip-data.json is fetched network-first
      (the service worker does that for us) and falls back to the app's cached copy offline.
   ===================================================================================== */
var D=null, EMB=null, GATE_ITER=150000;
async function unlockData(data,name,pw){
  var g=data.gate;
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(normName(name)+'|'+pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(g.salt),iterations:GATE_ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(g.iv)},key,b64d(g.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
/* Trip data on this phone — the app's rule (Sep 24 2026, M11/M12; a copy of index.html's tdLoad/tdSave/tdFetch —
   keep them the same). ONE saved copy in Cache Storage 'powder-data' under the plain address trip-data.json (the app
   writes it too; sw.js serves it with no signal). Open from it at once; ask the server in the background (10 s to
   answer, 90 s to finish) and swap a newer copy in when no claim form is open. The old localStorage copy is read
   once, moved into the saved copy, and deleted. */
var TD_CACHE='powder-data';
function tdKey(){ return new URL('trip-data.json',location.href).href; }
async function tdLoad(){
  try{ if(window.caches){ var r=await (await caches.open(TD_CACHE)).match(tdKey()); if(r)return {text:await r.text(),from:'cache'}; } }catch(e){}
  try{ var s=localStorage.getItem('dataCache'); if(s)return {text:s,from:'local'}; }catch(e){}
  try{ if(window.caches){ var ks=await caches.keys();
    for(var i=0;i<ks.length;i++){ var c=await caches.open(ks[i]), q=await c.keys(tdKey(),{ignoreSearch:true});
      if(q.length){ var rr=await c.match(q[q.length-1]); if(rr)return {text:await rr.text(),from:'old'}; } } } }catch(e){}
  return null; }
async function tdSave(text){
  if(!window.caches){ try{ localStorage.setItem('dataCache',text); }catch(e){} return false; }
  try{ await (await caches.open(TD_CACHE)).put(tdKey(),new Response(text,{headers:{'content-type':'application/json'}})); }catch(e){ return false; }
  try{ localStorage.removeItem('dataCache'); }catch(e){}
  return true; }
function tdFetch(firstMs,totalMs){ return new Promise(function(done){
  var ac=window.AbortController?new AbortController():null, over=false, t1, t2;
  function fin(v){ if(over)return; over=true; clearTimeout(t1); clearTimeout(t2); done(v); }
  function stop(){ if(ac)try{ ac.abort(); }catch(e){} fin(null); }
  t1=setTimeout(stop,firstMs); t2=setTimeout(stop,totalMs);
  fetch('trip-data.json?v='+Date.now(),{cache:'no-store',signal:ac?ac.signal:undefined}).then(function(r){
    clearTimeout(t1); if(!r.ok)return fin(null); return r.text().then(fin); }).catch(function(){ fin(null); }); }); }
/* tdRefresh(old) — the background check: save a newer copy, and put it on screen when no claim form is open */
async function tdRefresh(old){
  var tx=await tdFetch(10000,90000); if(!tx||tx===old)return;
  var nd; try{ nd=JSON.parse(tx); }catch(e){ return; } if(!nd||!(nd.gate||nd.meta))return;
  try{ var od=JSON.parse(old); if(od.gate&&nd.gate&&od.gate.iv===nd.gate.iv&&od.gate.ct===nd.gate.ct)return; }catch(e){}
  await tdSave(tx); if(!nd.gate||!D)return;
  var nm=localStorage.getItem('gname'), pw=localStorage.getItem('gpw'), fresh; if(!nm||!pw)return;
  try{ fresh=await unlockData(nd,nm,pw); }catch(e){ return; }
  (function swap(){ var a=document.activeElement, t=a&&a.tagName;
    if(FORM||t==='INPUT'||t==='TEXTAREA'||t==='SELECT'){ setTimeout(swap,3000); return; }
    EMB=nd; D=fresh; loadPlayers(); render(); toast('Trip data updated'); })(); }
function showForm(err){ $('gform').style.display=''; $('gsub').textContent='Same trip name and password as the app.'; $('gerr').textContent=err||''; }
async function boot(){
  var data=null;
  try{ var ov=localStorage.getItem('dataOverride'); if(ov)data=JSON.parse(ov); }catch(e){}   /* admin-imported plain data, like the app */
  if(!data){ var sv=await tdLoad(); if(sv){ try{ data=JSON.parse(sv.text); }catch(e){ data=null; } if(data){ if(sv.from!=='cache')tdSave(sv.text); tdRefresh(sv.text); } } }   /* the phone's saved copy first */
  if(!data){ var tx=await tdFetch(30000,600000); if(tx){ try{ data=JSON.parse(tx); tdSave(tx); }catch(e){ data=null; } } }   /* nothing saved: wait for the download */
  if(!data){ $('gsub').textContent=''; $('gerr').textContent='No trip data on this phone yet. Open the app once with signal, then come back.'; return; }
  if(!data.gate){ D=data; start(); return; }     /* un-gated data = the screenshot recipe / a plain import */
  EMB=data;
  var nm=localStorage.getItem('gname'), pw=localStorage.getItem('gpw');
  async function go(n,p){ try{ D=await unlockData(EMB,n,p); }catch(e){ showForm(n?'Wrong trip name or password.':''); return; }
    localStorage.setItem('gname',n); localStorage.setItem('gpw',p); start(); }
  if(nm&&pw) await go(nm,pw); else showForm('');
  $('gok').onclick=function(){ var n=$('gname').value,p=$('gpw').value; if(!n||!p){$('gerr').textContent='Both fields, ya donkey.';return;} $('gsub').textContent='Unlocking…'; go(n,p); };
}

/* =====================================================================================
   5. CLAIMS — the store. Server list (cache) + this phone's unsent queue.
      A claim = {id, ts, day, who, item, pts, by, witness, note, parts, target}
        item   = the code (or VOTE-LOTD / VOTE-COTD for votes, FIX for a reversal)
        parts  = for a line claim: the extra/trick/crash codes ticked, e.g. "CI+PD-CR"
        target = for a vote: who you voted for
   ===================================================================================== */
var CACHE=[], QUEUE=[];
function lsGet(k,dflt){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):dflt; }catch(e){ return dflt; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function loadStore(){ CACHE=lsGet('gnar-cache',[]); QUEUE=lsGet('gnar-queue',[]); }
/* every claim this phone knows: the sheet's list + this phone's unsent ones (tagged queued), with one
   reversal per claim (gnarOneFix, gnar-score.js — a second reversal from another phone is ignored) */
function allClaims(){
  var seen={}; CACHE.forEach(function(c){ seen[c.id]=1; });
  return gnarOneFix(CACHE.concat(QUEUE.filter(function(q){ return !seen[q.id]; }).map(function(q){ q=Object.assign({},q); q.queued=true; return q; })));
}
function addClaim(c){
  c.id=c.id||uid(); c.ts=c.ts||getNow().getTime(); c.day=c.day||skiDay(); c.by=c.by||ME;
  QUEUE.push(c); lsSet('gnar-queue',QUEUE);
  retryNow();   /* send it straight away; if there's no signal it waits quietly */
}
function online(){ return !!(D&&D.runsUrl) && navigator.onLine!==false; }

/* =====================================================================================
   5b. SENDING — one rule for everything this phone saves (the app's Runs & spots picks and
       emergency info follow the same rule):
       - a claim is written to this phone first (gnar-queue) and shows a small "not uploaded yet" tag;
       - it is sent (POST) with the crew token added at that moment (the token is never stored), and it
         leaves the queue only when the sheet's own list (GET ?gnar=1) shows its id;
       - retries are quiet (no toasts) and back off: 30 s, 1 min, 2 min, then every 5 min. They go at
         once when the phone comes back online, when the page opens and when you come back to it;
       - a retry redraws only when something changed, and never under your fingers (quietRefresh).
       The sheet keeps the first copy of an id, so sending a claim twice is harmless.
   ===================================================================================== */
var RETRY_WAIT=[30000,60000,120000,300000], RETRY={n:0,timer:null}, LOCKED=false;
/* this phone's crew token (a Promise; '' for old data with no dataKey) — gnar-score.js */
function tok(){ return gnarCrewToken(D&&D.dataKey); }
/* plan the next quiet retry, only while something is waiting */
function retryLater(){ clearTimeout(RETRY.timer); RETRY.timer=null;
  if(!QUEUE.length){ RETRY.n=0; return; }
  RETRY.timer=setTimeout(function(){ sync(false); },RETRY_WAIT[Math.min(RETRY.n,RETRY_WAIT.length-1)]); RETRY.n++; }
/* try right now and start the back-off again (new claim, back online, page opened) */
function retryNow(){ RETRY.n=0; sync(false); }
var FLUSHING=false;
/* send every queued claim that wasn't sent in the last 20 s. Stops at the first network error. */
async function flush(){
  if(!D||!D.runsUrl||FLUSHING||!QUEUE.length)return; FLUSHING=true;
  try{
    var k=await tok(), now=Date.now();
    for(var i=0;i<QUEUE.length;i++){ var q=QUEUE[i];
      if(q.sentAt&&now-q.sentAt<20000)continue;
      var body=Object.assign({action:'gnar'},q); delete body.sentAt; delete body.queued; if(k)body.k=k;
      try{ await fetch(D.runsUrl,{method:'POST',mode:'no-cors',body:JSON.stringify(body)}); q.sentAt=Date.now(); }
      catch(e){ break; }   /* offline: stop, keep the rest for later */
    }
    lsSet('gnar-queue',QUEUE);
  } finally{ FLUSHING=false; }
}
/* read the board from the sheet → 'ok' | 'locked' | 'fail'. On 'ok' the phone's copy is replaced and
   every queued claim whose id the sheet now shows leaves the queue. 'locked' (wrong or missing crew
   token) and 'fail' (no signal) keep everything the phone has. */
async function readBoard(){
  var j;
  try{ var k=await tok(); var r=await fetch(gnarWithK(D.runsUrl+'?gnar=1&t='+Date.now(),k)); j=await r.json(); }catch(e){ return 'fail'; }
  if(!Array.isArray(j)){ if(j&&j.error==='locked'){ LOCKED=true; return 'locked'; } return 'fail'; }
  LOCKED=false;
  var rows=j.map(normClaim), seen={}; rows.forEach(function(c){ seen[c.id]=1; });   /* confirm against every row, even an ignored second reversal */
  CACHE=gnarOneFix(rows); lsSet('gnar-cache',CACHE);
  var before=QUEUE.length; QUEUE=QUEUE.filter(function(q){ return !seen[q.id]; }); if(QUEUE.length!==before)lsSet('gnar-queue',QUEUE);
  return 'ok';
}
var SYNCING=false, SYNC_AGAIN=false;
/* send what's queued, read the board, redraw only if something changed, plan the next retry.
   manual=true when the person tapped ⟳ / "Sync now": only then does it say how it went. */
async function sync(manual){
  if(!D||!D.runsUrl){ if(manual)toast('No shared sheet set — scores stay on this phone'); return; }
  if(SYNCING){ SYNC_AGAIN=(SYNC_AGAIN==='manual'||manual)?'manual':'quiet'; return; }   /* busy: run once more when done (a tap on ⟳ still gets its answer) */
  SYNCING=true; clearTimeout(RETRY.timer); RETRY.timer=null;
  var sig=boardSig(), got='fail';
  try{
    if(manual||navigator.onLine!==false){ await flush(); got=await readBoard(); }
  }catch(e){}
  SYNCING=false;
  if(boardSig()!==sig) quietRefresh();
  if(manual) toast(got==='ok'?(QUEUE.length?'Board updated — '+QUEUE.length+' not uploaded yet':'Board up to date'):got==='locked'?'The crew server refused this phone — tell Tanner':'No signal — showing this phone’s copy');
  if(SYNC_AGAIN){ var again=SYNC_AGAIN; SYNC_AGAIN=false; return sync(again==='manual'); }
  retryLater();
}
/* a fingerprint of what the page shows from the store — a sync that changes nothing redraws nothing */
function boardSig(){ return JSON.stringify(CACHE)+'|'+QUEUE.map(function(q){ return q.id; }).join(',')+'|'+LOCKED; }
/* Redraw after a background sync without getting in the way. The tab pill and the top card always
   (no text boxes there). The Claim tab: only the list under the search box, so the box keeps focus and
   the keyboard stays up. Any other tab: only when nobody is typing in it and no box holds unsaved
   text — otherwise it waits (VIEW_STALE) until the box is left. The claim sheet is never touched. */
var VIEW_STALE=false;
function quietRefresh(){
  renderTabs(); renderMe();
  if(TAB==='claim'){ var cl=$('clist'); if(cl){ cl.innerHTML=claimList(); return; } }
  if(viewBusy()){ VIEW_STALE=true; return; }
  VIEW_STALE=false; renderView();
}
/* true while a text box / picker in the page is focused or holds something not saved yet */
function viewBusy(){ var v=$('view'); if(!v)return false; var a=document.activeElement;
  if(a&&v.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return true;
  var els=v.querySelectorAll('input,textarea,select');
  for(var i=0;i<els.length;i++){ var e=els[i];
    if(e.tagName==='SELECT'){ for(var j=0;j<e.options.length;j++){ if(e.options[j].selected!==e.options[j].defaultSelected)return true; } }
    else if(e.type==='checkbox'||e.type==='radio'){ if(e.checked!==e.defaultChecked)return true; }
    else if(e.value!==e.defaultValue)return true; }
  return false; }
document.addEventListener('focusout',function(){ setTimeout(function(){ if(VIEW_STALE&&!viewBusy()){ VIEW_STALE=false; renderView(); } },0); });
/* the sheet hands numbers back as strings sometimes — tidy each row */
var normClaim=gnarNorm;   /* gnar-score.js */

/* =====================================================================================
   6. SCORING
      GNAR Factor = every claim's pts for that player + the nightly vote awards.
      Votes: per ski day, each voter's LAST vote counts; most votes wins the award; a tie pays all.
   ===================================================================================== */
var isMeta=gnarIsMeta, voteAwards=gnarVoteAwards;   /* the maths live in gnar-score.js, shared with the Home card */
function scores(){ return gnarScores(allClaims(),PLAYERS,skiDay(),byCode); }
/* how often can this item be claimed? used to grey out rows already used up */
function usedUp(it,who){
  var all=allClaims(), fx=fixIndex(all);   /* a reversed claim no longer counts as "already logged" (m5) */
  var cl=all.filter(function(c){ return c.who===who&&c.item===it.c&&c.pts!==0&&standing(c,fx); }), day=skiDay(), rid=todayResort();
  if(it.f==='once') return cl.length>0;
  if(it.f==='day'||it.f==='daily'||it.f==='nightly') return cl.some(function(c){ return c.day===day; });
  if(it.f==='resort'){ if(!rid)return false; return cl.some(function(c){ return (dayInfo(c.day)||{}).rid===rid; }); }
  if(it.f==='max3') return cl.filter(function(c){ return c.day===day; }).length>=3;
  if(it.f==='max5') return cl.length>=5;
  return false;
}


/* =====================================================================================
   6b. SUPER BOWL PROPS — Feb 14, Revelstoke.
      Not items. A card that appears on the Board on Super Bowl Sunday (and the two days after, for
      results). Picks lock the moment you confirm them. Whoever has the remote records the results.
      Awards land on the board like the nightly votes. The anthem is the surprise — nobody sees it until
      the card shows up, then they guess the length and someone runs the stopwatch.
      Stored as claims with no points: PICK-<code> (target = your pick) and RES-<code> (target = the result,
      or for the judged ones the names of who got it, joined with +). Latest result wins; first pick sticks.
   ===================================================================================== */
/* SB_DAY and PROPS (the list of props and their points) live in gnar-score.js. */
function propsOn(){ var d=skiDay(); return d>=SB_DAY&&d<=addDays(SB_DAY,2); }
function addDays(s,n){ var d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
var propPicks=gnarPropPicks, propResult=gnarPropResult;
function propAwards(cl){ return gnarPropAwards(cl,PLAYERS); }
var SW={t0:0,acc:0,timer:null};
function swTick(){ var e=SW.acc+(SW.t0?Date.now()-SW.t0:0); var el=$('swdisp'); if(el)el.textContent=(e/1000).toFixed(1)+' s'; }
function swStart(){ if(SW.t0)return; SW.t0=Date.now(); SW.timer=setInterval(swTick,100); }
function swStop(){ if(!SW.t0)return; SW.acc+=Date.now()-SW.t0; SW.t0=0; clearInterval(SW.timer); swTick(); }
function swReset(){ swStop(); SW.acc=0; swTick(); }
function swSave(){ swStop(); var secs=Math.round(SW.acc/100)/10; if(!secs){ toast('Run the stopwatch first'); return; } recordResult('SBANTH',String(secs)); }
function propCard(cl){
  if(!propsOn())return '';
  var h='<div class="card stash"><h2>'+ic('tip',13)+' Super Bowl props · '+esc(fmtDay(SB_DAY))+'</h2><div class="xs t2" style="margin-bottom:6px">Pick before kickoff. A pick locks when you confirm it. Points land when the result is in.</div>';
  PROPS.forEach(function(p){ var picks=propPicks(cl,p.c), mine=ME?picks[ME]:null, res=propResult(cl,p.c);
    h+='<div class="lab">'+esc(p.n)+' · +'+p.p+(p.d?' <span style="font-weight:400;text-transform:none;letter-spacing:0">'+esc(p.d)+'</span>':'')+'</div>';
    if(mine) h+='<div class="sm"><b>You:</b> '+esc(mine.target)+' <span class="pill gray">locked</span></div>';
    else if(!ME) h+='<div class="xs t2">Pick your name at the top.</div>';
    else if(res) h+='<div class="xs t2">Too late — the result is in.</div>';
    else if(p.kind==='pick') h+='<select class="inp" id="pk-'+p.c+'"><option value="">Pick…</option>'+p.opts.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join('')+'</select><button class="btn pri" onclick="lockPick(\''+p.c+'\')">Lock it</button>';
    else if(p.kind==='seconds') h+='<input class="inp" id="pk-'+p.c+'" type="number" inputmode="decimal" placeholder="seconds"><button class="btn pri" onclick="lockPick(\''+p.c+'\')">Lock it</button>';
    else h+='<input class="inp" id="pk-'+p.c+'" placeholder="'+(p.c==='SBWIN'?'e.g. Chiefs by 6':'song')+'"><button class="btn pri" onclick="lockPick(\''+p.c+'\')">Lock it</button>';
    var others=Object.keys(picks).filter(function(w){ return w!==ME; }); if(others.length) h+='<div class="xs t2" style="margin-top:4px">'+others.map(function(w){ return esc(w)+': '+esc(picks[w].target); }).join(' · ')+'</div>';
    if(res){ var win=propAwards(cl).filter(function(a){ return a.prop===p.c; }).map(function(a){ return a.who; }); h+='<div class="sm" style="margin-top:4px"><b>Result:</b> '+esc(res.target)+(p.kind==='text'?'':'')+' · '+(win.length?esc(win.join(', '))+' +'+p.p:'nobody')+'</div>'; }
  });
  /* results — whoever has the remote */
  h+='<div class="hair"></div><div class="lab">Record a result</div><div class="xs t2" style="margin-bottom:6px">Anyone can. It asks twice. The latest entry wins, so a typo is fixable.</div>';
  PROPS.forEach(function(p){ var res=propResult(cl,p.c);
    h+='<div class="between" style="gap:6px;margin:6px 0;flex-wrap:wrap"><div class="sm" style="flex:1 0 110px">'+esc(p.n)+(res?' <span class="pill ok">in</span>':'')+'</div>';
    if(p.kind==='pick') h+='<select class="inp" id="rs-'+p.c+'" style="flex:1;margin:0"><option value="">Result…</option>'+p.opts.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join('')+'</select><button class="btn" onclick="recordResult(\''+p.c+'\')">Save</button>';
    else if(p.kind==='seconds') h+='<span class="b" id="swdisp" style="min-width:60px;text-align:right">'+((SW.acc+(SW.t0?Date.now()-SW.t0:0))/1000).toFixed(1)+' s</span><button class="btn" onclick="swStart()">Start</button><button class="btn" onclick="swStop()">Stop</button><button class="btn" onclick="swReset()">Reset</button><button class="btn pri" onclick="swSave()">Save</button>';
    else h+='<div class="who" style="margin:0;flex:2">'+PLAYERS.map(function(w){ return '<button class="'+(RESPICK[p.c]&&RESPICK[p.c][w]?'on':'')+'" onclick="toggleWinner(\''+p.c+'\',\''+jsq(w)+'\')">'+esc(w)+'</button>'; }).join('')+'</div><button class="btn" onclick="recordResult(\''+p.c+'\')">Save</button>';
    h+='</div>'; });
  return h+'</div>';
}
var RESPICK={};
function toggleWinner(code,w){ RESPICK[code]=RESPICK[code]||{}; RESPICK[code][w]=!RESPICK[code][w]; render(); }
function lockPick(code){ if(!ME){ toast('Pick your name first'); return; } var el=$('pk-'+code); var v=el?String(el.value||'').trim():''; if(!v){ toast('Pick something'); return; }
  var p=PROPS.filter(function(x){ return x.c===code; })[0];
  if(!confirm('Lock your pick for '+p.n+': "'+v+'"?\n\nThis cannot be changed. Are you sure?'))return;
  addClaim({who:ME,item:'PICK-'+code,pts:0,target:v.slice(0,60),note:'',day:SB_DAY}); toast('Locked: '+v); render(); }
function recordResult(code,val){ if(!ME){ toast('Pick your name first'); return; } var p=PROPS.filter(function(x){ return x.c===code; })[0], v=val;
  if(v==null){ if(p.kind==='text'){ v=PLAYERS.filter(function(w){ return RESPICK[code]&&RESPICK[code][w]; }).join('+'); if(!v){ toast('Tap who got it (or nobody: save with none)'); } }
    else { var el=$('rs-'+code); v=el?String(el.value||'').trim():''; if(!v){ toast('Pick the result first'); return; } } }
  if(!confirm('Record the result for '+p.n+': "'+(v||'nobody')+'"?'))return;
  if(!confirm('Sure? This puts points on the board.'))return;
  addClaim({who:ME,item:'RES-'+code,pts:0,target:(v||'').slice(0,80),note:'',day:SB_DAY}); toast('Result in'); render(); }

   ===================================================================================== */
var TAB='board', CAT='hill', RID=null, Q='';
var OPEN=lsGet('gnar-open',{});   /* which collapsible heads are open, by key — remembered on this phone */
function toggleZone(k,dflt){ var cur=(OPEN[k]!==undefined)?OPEN[k]:dflt; OPEN[k]=!cur; lsSet('gnar-open',OPEN); $('clist').innerHTML=claimList(); }
function render(){ VIEW_STALE=false; renderTabs(); renderView(); }
/* just the tab's content (render() = the tab chips + this) */
function renderView(){ var v=$('view');
  if(TAB==='board')v.innerHTML=vBoard(); else if(TAB==='claim')v.innerHTML=vClaim(); else if(TAB==='log')v.innerHTML=vLog(); else v.innerHTML=vRules(); }
function renderTabs(){ var t=[['board','Board','huck'],['claim','Claim','checklist'],['log','Log','pin'],['rules','Rules','tip']];
  $('tabs').innerHTML=t.map(function(x){ return '<button class="'+(TAB===x[0]?'on':'')+'" onclick="TAB=\''+x[0]+'\';render();window.scrollTo(0,0)">'+ic(x[2],13)+' '+x[1]+'</button>'; }).join('')
   +(QUEUE.length?'<button onclick="sync(true)"><span class="pill q">'+QUEUE.length+' not uploaded yet</span></button>':'<button onclick="sync(true)" title="Sync">⟳</button>'); }

/* ---- Board ---- */
function vBoard(){
  var sc=scores(), day=skiDay(), di=dayInfo(day), cl=allClaims();
  var order=PLAYERS.slice().sort(function(a,b){ return sc[b].total-sc[a].total; });
  var h='<div class="card"><h2>'+ic('huck',13)+' GNAR Factor</h2>';
  order.forEach(function(p,i){ var s=sc[p], tie=i>0&&sc[order[i-1]].total===s.total;
    h+='<div class="lb'+(i===0?' first':'')+'"><div class="rank">'+(tie?'=':(i+1))+'</div><div class="who"><div class="b">'+esc(p)+(p===ME?' <span class="pill gray">you</span>':'')+'</div><small>'+s.n+' claim'+(s.n===1?'':'s')+' · lines '+s.lines+' · extras '+s.extras+' · penalties '+s.pen+(s.votes?' · votes +'+s.votes:'')+(s.props?' · props +'+s.props:'')+'</small></div>'
      +'<div class="today">'+(s.today?fmtPts(s.today)+'<br><span class="xs muted" style="font-weight:400">today</span>':'')+'</div><div class="big">'+s.total+'</div></div>'; });
  if(!cl.length) h+='<div class="sm muted" style="margin-top:6px">Nothing on the board yet. First chair is Feb 6. Don’t be the guy we wait for.</div>';
  h+='</div>';
  /* today */
  var tc=cl.filter(function(c){ return c.day===day&&!isMeta(c); }).sort(function(a,b){ return b.ts-a.ts; });
  h+='<div class="card snow"><h2>'+ic('snowflake',13)+' '+esc(fmtDay(day))+(di?' · '+esc(di.title):'')+'</h2>';
  if(!tc.length) h+='<div class="sm t2">No claims yet today.'+(di&&di.rid?' Today’s hill: '+esc(resortName(di.rid))+'.':'')+'</div>';
  else tc.slice(0,8).forEach(function(c){ var it=byCode(c.item); h+='<div class="between" style="padding:4px 0"><div class="sm"><b>'+esc(c.who)+'</b> · '+esc(it?it.n:c.item)+(c.queued?' <span class="pill q">not uploaded yet</span>':'')+'</div><div class="b" style="'+(c.pts<0?'color:var(--pr-danger-text)':'')+'">'+fmtPts(c.pts)+'</div></div>'; });
  if(tc.length>8) h+='<div class="xs t2" style="margin-top:4px">+'+(tc.length-8)+' more in the log</div>';
  h+='</div>';
  /* votes */
  h+=voteCard(cl,day);
  h+=propCard(cl);
  return h;
}
function myVote(cl,day,kind){ var v=null; cl.forEach(function(c){ if(c.item==='VOTE-'+kind&&c.day===day&&c.who===ME&&(!v||c.ts>v.ts))v=c; }); return v?v.target:''; }
function voteCard(cl,day){
  var aw=voteAwards(cl).filter(function(a){ return a.day===day; });
  var h='<div class="card todo"><h2>'+ic('cheers',13)+' Tonight’s vote</h2><div class="xs t2" style="margin-bottom:6px">One vote each, not for yourself. Closes 3 am. Line of the day +'+VOTE_PTS.LOTD+', crash of the day +'+VOTE_PTS.COTD+' (unhurt only).</div>';
  [['LOTD','Line of the day'],['COTD','Crash of the day']].forEach(function(k){ var mine=myVote(cl,day,k[0]);
    h+='<div class="lab">'+k[1]+'</div><div class="vote">'+PLAYERS.filter(function(p){ return p!==ME; }).map(function(p){ return '<button class="'+(mine===p?'on':'')+'" onclick="castVote(\''+k[0]+'\',\''+jsq(p)+'\')">'+esc(p)+'</button>'; }).join('')+'</div>';
    var tally={}; var latest={}; cl.forEach(function(c){ if(c.item==='VOTE-'+k[0]&&c.day===day){ if(!latest[c.who]||c.ts>latest[c.who].ts)latest[c.who]=c; } });
    Object.keys(latest).forEach(function(v){ var t=latest[v].target; if(t)tally[t]=(tally[t]||0)+1; });
    var ts=Object.keys(tally).map(function(t){ return esc(t)+' '+tally[t]; });
    var lead=aw.filter(function(a){ return a.kind===k[0]; }).map(function(a){ return a.who; });
    h+='<div class="tally">'+(ts.length?ts.join(' · ')+' · <b>'+(lead.length>1?'tie — '+lead.map(esc).join(' and ')+' both get it':esc(lead[0])+' leads')+'</b>':'No votes yet.')+'</div>';
  });
  if(!ME) h+='<div class="xs t2" style="margin-top:6px">Pick your name at the top to vote.</div>';
  return h+'</div>';
}
function castVote(kind,who){ if(!ME){ toast('Pick your name first'); return; } if(who===ME){ toast('Not for yourself'); return; }
  addClaim({who:ME,item:'VOTE-'+kind,pts:0,target:who,note:''}); toast('Vote in: '+who); render(); }

/* ---- Claim ---- */
function vClaim(){
  if(!ME) return '<div class="card"><div class="sm muted">Pick your name at the top first.</div></div>';
  var h='<div class="chips">'+GROUPS.map(function(g){ return '<button class="'+(CAT===g[0]?'on':'')+'" onclick="CAT=\''+g[0]+'\';render()">'+ic(GROUP_ICON[g[0]],13)+' '+g[1]+'</button>'; }).join('')+'</div>';
  h+='<input class="inp" placeholder="Search everything…" value="'+esc(Q)+'" oninput="Q=this.value;$(\'clist\').innerHTML=claimList()">';
  h+='<div class="xs muted" style="margin:-4px 0 8px">Penalties sit next to the thing they undo. Log one on anyone — the claim shows who logged it.</div>';
  return h+'<div id="clist">'+claimList()+'</div>';
}
function claimList(){ var h='';
  var q=Q.trim().toLowerCase();
  if(q){ var hits=ITEMS.filter(function(it){ return (it.n+' '+it.d+' '+it.c).toLowerCase().indexOf(q)>=0&&it.g!=='lx'&&it.g!=='trick'&&it.sub!=='crash'; });
    return hits.length?hits.map(rowHtml).join(''):'<div class="sm muted">Nothing. Try a resort, a bar, a body part.</div>'; }
  if(CAT==='hill'){
    var rids=Object.keys(D.resorts||{}), tr=todayResort(); if(!RID) RID=tr||rids[0];
    if(tr&&rids.indexOf(tr)>0){ rids.splice(rids.indexOf(tr),1); rids.unshift(tr); }
    h+='<div class="chips">'+rids.map(function(r){ return '<button class="'+(RID===r?'on':'')+'" onclick="RID=\''+r+'\';render()">'+esc(resortName(r))+(r===tr?' <small>today</small>':'')+'</button>'; }).join('')+'</div>';
    h+='<div class="xs muted" style="margin:0 0 6px">Tap a line, tick what stacked on it. Once per day, first attempt, crash or not. Plan tonight from the odds under each one.</div>';
    var codesOf=function(f){ return ITEMS.filter(f).map(function(it){ return it.c; }); };   /* every head is collapsible; lines start open */
    h+=zoneHtml('hill:lines','Lines',codesOf(function(it){ return it.g==='line'&&it.r===RID&&!it.st; }),false);
    h+=zoneHtml('hill:storied','Storied — not hard, you just have to have done it',codesOf(function(it){ return it.g==='line'&&it.r===RID&&it.st; }),false);
    h+=zoneHtml('hill:sets','Sets — several in one day, scored once',codesOf(function(it){ return it.g==='set'&&it.r===RID; }),false);
    h+=zoneHtml('hill:also','Also at '+resortName(RID),(LAYOUT.hill.at[RID]||[]).concat(LAYOUT.hill.every),false);
    LAYOUT.hill.heads.forEach(function(z,i){ h+=zoneHtml('hill:'+i,z[0],z[1],!!z[2]); });
    h+='<div class="card alertcard" style="margin-top:12px"><h2>'+ic('alert',13)+' Zero, always</h2><div class="sm">Montana Bowl gate, the Chuting Project, Ymir ridge sidecountry, Silver Sheep / Record Ridge, Mt Roberts, Canyon Creek. Not up for a vote.</div></div>';
    return h;
  }
  var L=LAYOUT[CAT]; if(!L) return h;
  L.heads.forEach(function(z,i){ h+=zoneHtml(CAT+':'+i,z[0],z[1],!!z[2]); });
  if(CAT==='crew'){ var placed={}; Object.keys(LAYOUT).forEach(function(p){ (LAYOUT[p].every||[]).forEach(function(c){ placed[c]=1; }); Object.keys(LAYOUT[p].at||{}).forEach(function(r){ LAYOUT[p].at[r].forEach(function(c){ placed[c]=1; }); }); LAYOUT[p].heads.forEach(function(z){ z[1].forEach(function(c){ placed[c]=1; }); }); });
    var more=ITEMS.filter(function(it){ return !placed[it.c]&&it.g!=='line'&&it.g!=='set'&&it.g!=='lx'&&it.g!=='trick'; }).map(function(it){ return it.c; });
    if(more.length) h+=zoneHtml('crew:more','More — not filed under a head yet',more,false); }
  return h;
}
/* one head on the Claim tab: a tappable title with a count, then its rows when open.
   dflt = collapsed by default (the any-day heads under each hill); the phone remembers what you opened. */
function zoneHtml(key,title,codes,collapsed){
  var items=codes.map(byCode).filter(Boolean); if(!items.length) return '';
  var open=(OPEN[key]!==undefined)?OPEN[key]:!collapsed;
  return '<div class="zone zc" onclick="toggleZone(\''+key+'\','+(!collapsed)+')"><span>'+esc(title)+'</span><span>'+items.length+' '+(open?'▾':'▸')+'</span></div>'+(open?items.map(rowHtml).join(''):'');
}
function rowHtml(it){ var used=usedUp(it,ME);
  return '<div class="row'+(used?' done':'')+'" onclick="openClaim(\''+it.c+'\')"><div class="nm">'+esc(it.n)+(it.st?' <span class="pill gray">storied</span>':'')+(it.g==='set'?' <span class="pill info">set</span>':'')+(it.d?'<small>'+esc(it.d)+'</small>':'')+(it.o?'<small class="t2">Feb: '+esc(it.o)+'</small>':'')+'<small class="t2">'+[(it.g==='line'||it.g==='set')?'':freqText(it),needsWitness(it)?'witness':'',used?'claimed':''].filter(Boolean).join(' · ')+'</small></div><div class="pts'+(it.p<0?' neg':'')+'">'+fmtPts(it.p)+'</div></div>'; }
function freqText(it){ return {day:'once a day',daily:'daily',nightly:'nightly',once:'once',resort:'per resort',unl:'unlimited',max3:'max 3 a night',max5:'max 5'}[it.f]||''; }

/* the claim sheet */
var FORM=null;
function openClaim(code){ var it=byCode(code); if(!it)return; document.body.style.overflow='hidden';
  FORM={it:it,who:it.p<0?'':ME,parts:{},trick:'',witness:'',note:''};
  if(it.p>=0) FORM.who=ME;
  drawSheet(); $('sheet').classList.add('open'); }
function closeSheet(){ $('sheet').classList.remove('open'); FORM=null; document.body.style.overflow=''; }
function formTotal(){ var t=FORM.it.p; Object.keys(FORM.parts).forEach(function(c){ if(FORM.parts[c]){ var x=byCode(c); if(x)t+=x.p; } }); if(FORM.trick){ var tr=byCode(FORM.trick); if(tr)t+=tr.p; } return t; }
function drawSheet(){ var it=FORM.it, isLine=it.g==='line', isPen=it.p<0, h='';
  h+='<div class="between"><div><div class="lab">'+esc(it.g==='set'?'Set':(GROUPS.filter(function(g){ return g[0]===it.g; }).map(function(g){ return g[1]; })[0]||''))+((isLine||it.g==='set')?' · '+esc(resortName(it.r)):'')+'</div><div class="b" style="font-size:17px">'+esc(it.n)+'</div>'+(it.d?'<div class="xs muted" style="margin-top:2px">'+esc(it.d)+'</div>':'')+(it.o?'<div class="xs muted" style="margin-top:2px">Open in Feb: '+esc(it.o)+'</div>':'')+'</div><button class="btn" onclick="closeSheet()">✕</button></div>';
  if(isPen){ h+='<div class="lab">Who</div><div class="who">'+PLAYERS.map(function(p){ return '<button class="'+(FORM.who===p?'on':'')+'" onclick="FORM.who=\''+jsq(p)+'\';drawSheet()">'+esc(p)+'</button>'; }).join('')+'</div>'; }
  else h+='<div class="xs muted" style="margin-top:6px">For <b>'+esc(ME)+'</b>. Points you log for yourself.</div>';
  if(isLine||it.g==='set'){
    /* the line itself, as a locked row — so the sheet reads worth + extras + trick − crashes */
    h+='<div class="lab">The '+(it.g==='set'?'set':'line')+'</div><div class="opt on" style="cursor:default"><div class="box">'+ic('check',14)+'</div><div class="l">'+(it.g==='set'?'Did it':'Rode it')+'<small>'+esc(it.n)+(it.g==='set'?'':', top to bottom. An attempt counts — crash or not, first try only.')+'</small></div><div class="p">'+fmtPts(it.p)+'</div></div>';
  }
  if(isLine){
    h+='<div class="lab">Stacked on it</div>'+ITEMS.filter(function(x){ return x.g==='lx'; }).map(optHtml).join('');
    h+='<div class="lab">Trick (one)</div>'+ITEMS.filter(function(x){ return x.g==='trick'; }).map(function(x){ return '<div class="opt'+(FORM.trick===x.c?' on':'')+'" onclick="FORM.trick=FORM.trick===\''+x.c+'\'?\'\':\''+x.c+'\';drawSheet()"><div class="box">'+(FORM.trick===x.c?ic('check',14):'')+'</div><div class="l">'+esc(x.n)+(x.s?' <span class="pill gray">'+(x.s==='ski'?'skis':'board')+'</span>':'')+(x.d?'<small>'+esc(x.d)+'</small>':'')+'</div><div class="p">'+fmtPts(x.p)+'</div></div>'; }).join('');
    h+='<div class="lab">Crash</div>'+ITEMS.filter(function(x){ return x.sub==='crash'; }).map(optHtml).join('');
  }
  var wit=needsWitness(it);
  if(!isPen){ h+='<div class="lab">Witness'+(wit?' — required':'')+'</div><div class="who">'+PLAYERS.filter(function(p){ return p!==ME; }).map(function(p){ return '<button class="'+(FORM.witness===p?'on':'')+'" onclick="FORM.witness=FORM.witness===\''+jsq(p)+'\'?\'\':\''+jsq(p)+'\';drawSheet()">'+esc(p)+'</button>'; }).join('')+'</div>'; }
  h+='<div class="lab">Note</div><input class="inp" id="fnote" placeholder="'+(isLine?'How it went, in five words':'Optional')+'" value="'+esc(FORM.note)+'" oninput="FORM.note=this.value">';
  var total=formTotal();
  h+='<div class="total"><div class="sm t2">'+(isLine?'Line score':'Points')+'</div><div class="n'+(total<0?' neg':'')+'" style="'+(total<0?'color:var(--pr-danger-text);text-shadow:none':'')+'">'+fmtPts(total)+'</div></div>';
  var block=''; if(isPen&&!FORM.who)block='Pick who.'; else if(wit&&!FORM.witness)block='Needs a witness.'; else if(!isPen&&usedUp(it,ME))block='Already claimed for this '+({day:'day',daily:'day',nightly:'night',once:'trip',resort:'resort',max3:'night',max5:'trip'}[it.f]||'period')+'.';
  h+='<button class="btn pri wide" '+(block?'disabled':'')+' onclick="submitClaim()">'+(block?esc(block):'Log it')+'</button>';
  if(it.c==='PO'||it.c==='PO2') h+='<div class="xs muted" style="margin-top:8px">Poach: log yours as a line extra; log theirs as the Poached penalty.</div>';
  $('pane').innerHTML=h;
}
function optHtml(x){ var on=!!FORM.parts[x.c]; return '<div class="opt'+(on?' on':'')+'" onclick="FORM.parts[\''+x.c+'\']=!FORM.parts[\''+x.c+'\'];drawSheet()"><div class="box">'+(on?ic('check',14):'')+'</div><div class="l">'+esc(x.n)+(x.d?'<small>'+esc(x.d)+'</small>':'')+'</div><div class="p'+(x.p<0?' neg':'')+'" style="'+(x.p<0?'color:var(--pr-danger-text)':'')+'">'+fmtPts(x.p)+'</div></div>'; }
function submitClaim(){ var it=FORM.it, parts=[];
  Object.keys(FORM.parts).forEach(function(c){ if(FORM.parts[c])parts.push(c); }); if(FORM.trick)parts.push(FORM.trick);
  var c={who:FORM.who||ME,item:it.c,pts:formTotal(),witness:FORM.witness||'',note:(FORM.note||'').trim().slice(0,140),parts:parts.join('+'),target:''};
  addClaim(c); closeSheet(); toast((c.who===ME?'Logged ':'Logged on '+c.who+' ')+fmtPts(c.pts)+(online()?'':' — it uploads when there’s signal')); render(); }

/* ---- Log ---- */
function vLog(){ var all=allClaims(), fx=fixIndex(all), cl=all.filter(function(c){ return !isMeta(c); }).sort(function(a,b){ return b.ts-a.ts; });
  if(!cl.length) return '<div class="card"><div class="sm muted">Empty. For now.</div></div>';
  var h='', last='';
  cl.forEach(function(c){ if(c.day!==last){ last=c.day; var di=dayInfo(c.day); h+=(h?'</div>':'')+'<div class="card"><h2>'+esc(fmtDay(c.day))+(di?' · '+esc(di.title):'')+'</h2>'; }
    var it=byCode(c.item), nm=it?it.n:(c.item==='FIX'?'Reversal':c.item);
    var meta=[c.by&&c.by!==c.who?'logged by '+c.by:'',c.witness?'witness '+c.witness:'',c.parts?c.parts.split('+').map(function(p){ var x=byCode(p); return x?x.n:p; }).join(', '):'',c.note||''].filter(Boolean).join(' · ');
    /* Reverse: your own sent claims (a reversal too), once — it goes away as soon as a reversal exists */
    var act=c.queued&&c.by===ME?'<div class="act" onclick="dropQueued(\''+jsq(c.id)+'\')">Delete</div>'
      :(!c.queued&&c.by===ME&&c.pts!==0&&!fx[c.id]?'<div class="act" onclick="reverse(\''+jsq(c.id)+'\')">Reverse</div>':'');
    h+='<div class="lg"><div class="p'+(c.pts<0?' neg':'')+'">'+fmtPts(c.pts)+'</div><div class="d"><b>'+esc(c.who)+'</b> · '+esc(nm)+(c.queued?' <span class="pill q">not uploaded yet</span>':'')+(fx[c.id]?' <span class="pill gray">reversed</span>':'')+(meta?'<small>'+esc(meta)+'</small>':'')+'</div>'+act+'</div>';
  });
  return h+'</div>';
}
function dropQueued(id){ QUEUE=QUEUE.filter(function(q){ return q.id!==id; }); lsSet('gnar-queue',QUEUE); toast('Deleted'); render(); }
/* m5 helpers. fixIndex(claims) → {claim id: its reversal}. allClaims() already keeps one reversal per
   claim, so this is the one that counts. standing(c) — does claim c still count? No while its reversal
   stands; reversing the reversal puts the claim back (depth guard against a loop in bad data). */
function fixIndex(cl){ var f={}; cl.forEach(function(c){ if(c.item==='FIX'&&c.target&&!f[c.target])f[c.target]=c; }); return f; }
function standing(c,fx,depth){ depth=depth||0; var r=fx[c.id]; if(!r||depth>20)return true; return !standing(r,fx,depth+1); }
/* the sheet is append-only, so a mistake is undone by a mirror claim — the history stays honest.
   One reversal per claim: a second tap (or a reversal that arrived from another phone meanwhile) is ignored. */
function reverse(id){ var c=allClaims().filter(function(x){ return x.id===id; })[0]; if(!c)return;
  if(fixIndex(allClaims())[id]){ toast('Already reversed'); render(); return; }
  var what=c.item==='FIX'?'this reversal':fmtPts(c.pts)+' for '+c.who;
  if(!confirm('Reverse '+what+'? Adds a mirror claim; the original stays in the log.'))return;
  if(fixIndex(allClaims())[id]){ toast('Already reversed'); render(); return; }   /* checked again: the dialog can sit open while a sync lands */
  var it=byCode(c.item);
  addClaim({who:c.who,item:'FIX',pts:-c.pts,witness:'',note:c.item==='FIX'?'undoes a reversal':'reverses '+(it?it.n:c.item),parts:'',target:c.id}); toast('Reversed'); render(); }

/* ---- Rules ---- */
function vRules(){
  var h='<div class="card"><h2>'+ic('tip',13)+' How it works</h2>'+RULES.map(function(r){ return '<div class="sm" style="padding:4px 0;border-bottom:1px solid var(--pr-hairline)">'+esc(r)+'</div>'; }).join('')+'<div class="xs muted" style="margin-top:8px">Line score = worth + extras + trick − crashes. GNAR Factor = line scores + everything else − penalties + vote awards.</div></div>';
  h+='<div class="card"><h2>'+ic('checklist',13)+' You</h2><div class="who">'+PLAYERS.map(function(p){ return '<button class="'+(ME===p?'on':'')+'" onclick="setMe(\''+jsq(p)+'\')">'+esc(p)+'</button>'; }).join('')+'</div></div>';
  var secs=[['line','Lines'],['set','Sets — several in one day'],['lx','Line extras'],['trick','Tricks'],['hill','On hill'],['prep','Prep and daily discipline'],['town','Business meetings'],['road','Roadside'],['stick','Sticker hunt'],['bonus','Stupid bonuses'],['pen','Penalties']];
  secs.forEach(function(s){ var list=ITEMS.filter(function(it){ return it.g===s[0]; }); var tint=GROUP_TINT[s[0]]||'';
    h+='<div class="card '+tint+'"><h2>'+ic(GROUP_ICON[s[0]]||'tip',13)+' '+esc(s[1])+'</h2><table class="rl">';
    var lastR='';
    list.forEach(function(it){ if((s[0]==='line'||s[0]==='set')&&it.r!==lastR){ lastR=it.r; h+='<tr><td colspan="2" class="xs b" style="padding-top:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--pr-text-2)">'+esc(resortName(it.r))+'</td></tr>'; }
      h+='<tr><td>'+esc(it.n)+(it.s?' <span class="pill gray">'+(it.s==='ski'?'skis':'board')+'</span>':'')+(it.st?' <span class="pill gray">storied</span>':'')+(it.d?'<div class="xs t2">'+esc(it.d)+'</div>':'')+(it.o?'<div class="xs t2">Feb: '+esc(it.o)+'</div>':'')+'<div class="xs t2">'+((it.g==='line'||it.g==='set')?'':freqText(it))+(needsWitness(it)?' · witness':'')+'</div></td><td class="p'+(it.p<0?' neg':'')+'">'+fmtPts(it.p)+'</td></tr>'; });
    h+='</table></div>'; });
  h+='<div class="card"><h2>App</h2><div class="sm" style="margin-bottom:8px">'+(D.runsUrl?'Board shared through the crew sheet.':'No shared sheet set — scores stay on this phone.')+' Version '+esc(D.version||'')+'.</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="sync(true)">⟳ Sync now</button><button class="btn" onclick="refreshPage()">Reload latest page</button></div></div>';
  return h;
}
/* The app's service worker serves this page stale-first. After a push, this drops only gnar.html from the cache and reloads. */
/* Sep 24 2026 (same rule as the app's "Refresh"): check for real signal FIRST. With no signal, deleting the
   saved page would leave this phone with no G.N.A.R. page at all — so it says so and changes nothing. */
async function refreshPage(){
  var online=false; try{ var ac=new AbortController(), tm=setTimeout(function(){ ac.abort(); },6000);
    var r=await fetch('gnar-data.js?ping='+Date.now(),{method:'HEAD',cache:'no-store',signal:ac.signal}); clearTimeout(tm); online=!!(r&&r.ok); }catch(e){}
  if(!online){ toast('No signal — nothing changed. Try again with signal.'); return; }
  toast('Reloading…'); var done=function(){ location.reload(); };
  if(!window.caches){ done(); return; }
  caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.open(k).then(function(c){ return c.keys().then(function(reqs){ return Promise.all(reqs.filter(function(r){ return /gnar\.html|gnar-data\.js/.test(r.url); }).map(function(r){ return c.delete(r); })); }); }); })); }).then(done,done); }

/* =====================================================================================
   8. START
   ===================================================================================== */
function start(){
  $('gate').style.display='none';
  loadPlayers(); loadStore(); renderMe(); render();
  retryNow();   /* page opened: read the board and send anything still waiting — quietly */
  window.addEventListener('online',retryNow);   /* back online: try at once, no toast */
  document.addEventListener('visibilitychange',function(){ if(!document.hidden)retryNow(); });
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
boot();
</script>
