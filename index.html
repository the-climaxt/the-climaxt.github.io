  h+='<div class="card"><h2>Document vault</h2><div class="xs muted" style="margin-bottom:8px"><b>My files</b></div><div id="doclist" class="sm muted">…</div><label class="btn" style="margin-top:8px;cursor:pointer">＋ Add file<input type="file" hidden onchange="addDoc(this)"></label><div style="border-top:1px solid var(--pr-hairline);margin-top:12px;padding-top:10px"><div class="xs muted" style="margin-bottom:8px"><b>Trip docs</b></div>'+((D.docs||[]).map(function(dd){ return '<div class="between" style="padding:6px 0;border-bottom:1px solid var(--pr-hairline)"><div class="sm" style="font-weight:600;flex:1;padding-right:8px">'+esc(dd.name)+'</div><button class="btn" onclick="openEmbDoc(\''+esc(dd.id)+'\')">Open</button></div>'; }).join('')||'<div class="sm muted">None yet.</div>')+'</div>'+(D.docsUrl?'<div style="border-top:1px solid var(--pr-hairline);margin-top:12px;padding-top:10px"><div class="xs muted" style="margin-bottom:8px"><b>Crew files</b></div><div id="sdoclist" class="sm muted">…</div><label class="btn" style="margin-top:8px;cursor:pointer">＋ Share a file<input type="file" hidden onchange="addSharedDoc(this)"></label></div>':'')+'</div>';
  h+='<div class="card alertcard"><h2 style="color:var(--pr-danger-text)">'+ic('alert',13)+' Emergency</h2>'+hurtHtml()+'<div style="margin-top:10px;border-top:1px solid var(--pr-hairline);padding-top:6px"><div class="xs muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.4px">Everyone</div>'+contactRows()+'</div></div>';
  if(!readyLive())h+=emgFormCard();
  /* m11 (Sep 24 2026): the hospitals come from hospitals[] — all 7 stops (it used to list 5 of 7, missing
     Invermere and Trail). m10: every call link is a ≥44 px tap target for gloved hands. */
  h+='<div class="card"><h2>Safety &amp; emergency</h2>'; (D.safety||[]).concat((D.hospitals||[]).map(function(x){ return {name:x.name,v:x.v}; })).forEach(function(s){ h+='<div class="between" style="padding:5px 0;border-bottom:1px solid var(--pr-hairline)"><div class="sm">'+esc(s.name)+'</div>'+(s.url?'<a href="'+s.url+'" target="_blank" class="sm tap44">open ↗</a>':'<a href="tel:'+esc(s.v)+'" class="sm tap44" style="font-weight:700">'+esc(s.v)+'</a>')+'</div>'; }); h+='</div>';
  if(!readyLive())h+=packingCard();
  h+='<div class="card"><h2>App</h2><div class="lk" onclick="lockApp()"><div style="flex:1">Lock this phone<small>sign out — trip name &amp; password needed again</small></div><span>🔒</span></div><div class="lk" onclick="hardRefresh()"><div style="flex:1">Refresh app &amp; data<small>clear the offline cache, reload the latest now</small></div><span>⟳</span></div></div>';
  if(adminOn()){
    h+='<div class="card"><h2>🧪 Test mode (admin)</h2><div class="xs muted" style="margin-bottom:8px">Pretend it’s a different date/time. Set it to <b>Jul 4</b> to preview example storm/ski conditions on the Snow tab.</div><input class="inp" type="datetime-local" id="testInput"><div style="margin-top:8px"><button class="btn pri" onclick="setTest()">Set test time</button> <button class="btn" onclick="clearTest()">Reset to now</button></div></div>';
    h+=tripAccessCard();   /* M19: the card lives next to adminReEncrypt() */
    h+='<div class="card"><h2>Trip data (admin)</h2>'
     +'<label class="lk" style="cursor:pointer"><div style="flex:1">Import updated data<small>load a new trip-data.json</small></div><span>＋</span><input type="file" hidden accept="application/json,.json" onchange="importData(this)"></label>'
     +'<div class="lk" onclick="exportData()"><div style="flex:1">Export decrypted data<small>plain-JSON backup of everything (keep it private)</small></div><span>⬇</span></div>'
     +(localStorage.getItem('dataOverride')?'<div class="lk" onclick="resetData()"><div style="flex:1">Clear imported data<small>go back to the hosted file</small></div><span>↺</span></div>':'')
     +'<div class="lk" onclick="lockAdmin()"><div style="flex:1">Lock admin<small>hide these controls again</small></div><span>🔒</span></div>'
     +'<div class="xs muted" style="margin-top:8px">Source: '+(localStorage.getItem('dataOverride')?'imported override':'hosted trip-data.json')+'</div></div>';
  }
  h+='<div class="xs muted" style="text-align:center;padding:6px 0 10px;cursor:pointer" onclick="bumpVer()">BC Powder Run · v'+esc((D.version||'?'))+(adminOn()?' · admin on':'')+'</div>';
  setView('v-more',h); listDocs(); listSharedDocs();
}

/* ---- data import/export ---- */
function importData(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var j=JSON.parse(rd.result);localStorage.setItem('dataOverride',JSON.stringify(j));if(j.gate){toast('Encrypted data imported — reloading');setTimeout(function(){location.reload();},700);}else{D=j;toast('Plain trip data loaded (this phone only)');render('more');}}catch(e){toast('Not valid JSON');}};rd.readAsText(f);}
function exportData(){var b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trip-data.json';a.click();}
function resetData(){localStorage.removeItem('dataOverride');toast('Cleared — reloading');setTimeout(function(){location.reload();},700);}
/* hardRefresh() — More → "Refresh app & data". M10/R15 (Sep 24 2026): it used to delete every cache (including ~55 MB
   of saved trail maps) and the saved trip data, even with no signal — on a mountain that left an empty app. Now it
   checks for REAL signal first (a small download, not just navigator.onLine) and does nothing without it. With
   signal it downloads the trip data and the app's own files again, replacing each one only when the new copy has
   arrived, then reloads. Saved maps are never touched. */
async function hardRefresh(){
  if(!confirm('Get the latest app and trip data now? Your saved maps stay on this phone.'))return;
  toast('Checking for signal…');
  if(!(await hasSignal(6000))){ alert('No signal right now, so nothing was changed. Everything saved on this phone is still here. Try again when you have signal.'); return; }
  toast('Refreshing…');
  var tx=await tdFetch(15000,120000);
  if(tx&&tdValid(tx))await tdSave(tx);
  await swAsk({t:'refresh-shell'},30000);       /* the service worker re-downloads index.html, 3d.html, fonts … */
  try{ var reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg)await reg.update(); }catch(e){}
  location.reload();
}
/* timedFetch(url,opts,ms) — fetch that gives up after ms. Resolves the Response, or null (no signal / too slow). */
function timedFetch(url,opts,ms){ return new Promise(function(done){
  var ac=window.AbortController?new AbortController():null, t=setTimeout(function(){ if(ac)try{ ac.abort(); }catch(e){} done(null); },ms);
  opts=opts||{}; if(ac)opts.signal=ac.signal;
  fetch(url,opts).then(function(r){ clearTimeout(t); done(r); },function(){ clearTimeout(t); done(null); }); }); }
/* hasSignal(ms) — true when the site really answers: a tiny HEAD request that skips every cache (the service worker
   lets HEAD through untouched). navigator.onLine alone says "online" on a dead hotel wifi or one bar of nothing. */
function hasSignal(ms){ return timedFetch('manifest.json?ping='+Date.now(),{method:'HEAD',cache:'no-store'},ms||6000).then(function(r){ return !!(r&&r.ok); }); }
/* swAsk(msg,ms) — send the service worker a message and wait (up to ms) for its answer; null when there's no worker */
function swAsk(msg,ms){ return new Promise(function(done){
  var c=navigator.serviceWorker&&navigator.serviceWorker.controller; if(!c||!window.MessageChannel)return done(null);
  var ch=new MessageChannel(), t=setTimeout(function(){ done(null); },ms);
  ch.port1.onmessage=function(e){ clearTimeout(t); done(e.data); };
  try{ c.postMessage(msg,[ch.port2]); }catch(e){ clearTimeout(t); done(null); } }); }
function adminOn(){ return localStorage.getItem('admin')==='1'; }
var _vt=0;
function bumpVer(){ if(adminOn())return; _vt++; if(_vt>=5){ localStorage.setItem('admin','1'); _vt=0; toast('Admin unlocked'); rMore(); } else if(_vt>=3){ toast((5-_vt)+' more taps…'); } }
function lockAdmin(){ localStorage.removeItem('admin'); _vt=0; toast('Admin locked'); rMore(); }

/* ---- trip data on this phone (Sep 24 2026 — M11, M12, R19) ----
   ONE saved copy, in Cache Storage 'powder-data' under the plain address trip-data.json. sw.js serves that same copy
   when a page asks with no signal; gnar.html reads and writes it the same way. Before: every open saved a new
   trip-data.json?v=<time> copy (6 opens = 5 copies, 12 MB) plus a 2.35 MB copy in localStorage (limit ~5 MB), and
   Home stayed blank until the whole file downloaded. Now the app draws from the saved copy at once and asks the server
   in the background (10 s to answer, 90 s to finish). A newer copy is saved and swapped in quietly when you're not
   in the middle of something ("Trip data updated").
   The old localStorage copy ('dataCache') is still READ, so a phone that only has it opens offline after this
   update; it is deleted once the Cache Storage copy is written, and never written again (except in a browser with
   no Cache Storage at all). Cache Storage is not less safe: a phone clears localStorage and Cache Storage together. */
var TD_CACHE='powder-data', TD_TEXT=null, TD_NEXT=null;
function tdKey(){ return new URL('trip-data.json',location.href).href; }
/* tdLoad() — the saved trip data as text: {text, from:'cache'|'local'|'old'}, or null when this phone has none */
async function tdLoad(){
  try{ if(window.caches){ var r=await (await caches.open(TD_CACHE)).match(tdKey()); if(r)return {text:await r.text(),from:'cache'}; } }catch(e){}
  try{ var s=localStorage.getItem('dataCache'); if(s)return {text:s,from:'local'}; }catch(e){}
  try{ if(window.caches){ var ks=await caches.keys();          /* the pile an older service worker kept: the newest copy */
    for(var i=0;i<ks.length;i++){ var c=await caches.open(ks[i]), q=await c.keys(tdKey(),{ignoreSearch:true});
      if(q.length){ var rr=await c.match(q[q.length-1]); if(rr)return {text:await rr.text(),from:'old'}; } } } }catch(e){}
  return null; }
/* tdSave(text) — replace the one saved copy. Returns true when it is stored. */
async function tdSave(text){
  if(!window.caches){ try{ localStorage.setItem('dataCache',text); }catch(e){} return false; }   /* very old browser: as before */
  try{ await (await caches.open(TD_CACHE)).put(tdKey(),new Response(text,{headers:{'content-type':'application/json'}})); }
  catch(e){ console.warn('Trip data not saved on this phone:',e); return false; }
  try{ localStorage.removeItem('dataCache'); }catch(e){}
  return true; }
/* tdFetch(firstMs,totalMs) — download trip-data.json; null when there's no answer in firstMs or it isn't all here in
   totalMs. The ?v=<time> only gets past the browser's and GitHub's caches — it is never saved under that address. */
function tdFetch(firstMs,totalMs){ return new Promise(function(done){
  var ac=window.AbortController?new AbortController():null, over=false, t1, t2;
  function fin(v){ if(over)return; over=true; clearTimeout(t1); clearTimeout(t2); done(v); }
  function stop(){ if(ac)try{ ac.abort(); }catch(e){} fin(null); }
  t1=setTimeout(stop,firstMs); t2=setTimeout(stop,totalMs);
  fetch('trip-data.json?v='+Date.now(),{cache:'no-store',signal:ac?ac.signal:undefined}).then(function(r){
    clearTimeout(t1); if(!r.ok)return fin(null); return r.text().then(fin); }).catch(function(){ fin(null); }); }); }
/* tdValid(text) — a whole, usable trip-data file (a cut-off download never replaces a good copy) */
function tdValid(t){ try{ var j=JSON.parse(t); return !!(j&&typeof j==='object'&&(j.gate||j.meta)); }catch(e){ return false; } }
/* tdSame(a,b) — the same trip data? Sealed files compare by their sealed bytes (a re-seal is a new copy). */
function tdSame(a,b){ if(a===b)return true; if(!a||!b)return false;
  try{ var x=JSON.parse(a), y=JSON.parse(b); if(x.gate&&y.gate)return x.gate.iv===y.gate.iv&&x.gate.ct===y.gate.ct; }catch(e){} return false; }
/* tdRefresh() — the background check after drawing from the saved copy */
async function tdRefresh(){
  var tx=await tdFetch(10000,90000); if(!tx||!tdValid(tx))return;   /* no signal / too slow / cut off: keep what we have */
  if(tdSame(tx,TD_TEXT))return;
  await tdSave(tx); TD_TEXT=tx;
  var data=JSON.parse(tx); if(!data.gate)return;                    /* plain data only comes from an admin import */
  var nm=null, pw=null; try{ nm=localStorage.getItem('gname'); pw=localStorage.getItem('gpw'); }catch(e){}
  if(!GATEKEY||!nm||!pw){ EMB=data; return; }                       /* not signed in yet: the sign-in form uses the new copy */
  var o; try{ o=await gateOpen(data,nm,pw); }
  catch(e){ EMB=data; if(e.message==='bad-pw')toast('The trip password changed. You’ll need the new one next time you open the app.'); return; }
  TD_NEXT={emb:data,d:o.d,key:o.key}; tdSwapWhenIdle(); }
/* tdBusy() — don't swap the data under someone: an open map/sheet, a focused field, or text the user typed into a
   field that is still on screen (a half-filled form). Only real typing counts (the 'input' event): some fields are
   filled in by the app itself, like the currency box on Home. After a tab switch the typed field is gone. */
var TD_TYPED=null;
document.addEventListener('input',function(e){ var x=e.target, ty=((x&&x.type)||'').toLowerCase(); if(ty!=='checkbox'&&ty!=='radio')TD_TYPED=x; },true);
function tdBusy(){ if(document.querySelector('#zov.on,#sov.on,#lsheet.on'))return true;
  var a=document.activeElement, t=a&&a.tagName; if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||(a&&a.isContentEditable))return true;
  var x=TD_TYPED; return !!(x&&x.isConnected&&x.closest&&x.closest('#v-'+CUR)&&(x.value||'')!==''); }
/* tdSwapWhenIdle() — put the newer trip data on screen as soon as the user isn't busy (checks every 3 s) */
function tdSwapWhenIdle(){ clearTimeout(tdSwapWhenIdle.t); if(!TD_NEXT)return;
  if(tdBusy()){ tdSwapWhenIdle.t=setTimeout(tdSwapWhenIdle,3000); return; }
  var n=TD_NEXT; TD_NEXT=null; EMB=n.emb; D=n.d; GATEKEY=n.key;
  initDataKey().then(function(){ var y=window.scrollY; drawSafe(CUR); window.scrollTo(0,y); try{ loadEmg(); }catch(e){} toast('Trip data updated'); }); }

/* drawSafe(v) — draw a view; if the drawing code crashes, say so plainly and keep the app unlocked. M9: this crash
   used to land in the sign-in's catch and show "Wrong trip name or password", sending people to retype a good one. */
function drawSafe(v){ try{ render(v); return true; }
  catch(e){ console.error('Drawing the '+v+' page failed:',e);
    var el=$('v-'+v)||$('v-home');
    if(el)el.innerHTML='<div class="hh"><h1>BC Powder Run</h1></div><div class="card"><h2>Something broke while drawing this page</h2><div class="sm">You’re still signed in. Tap Try again, or open another tab. If it keeps happening, close the app and open it again.</div><button class="btn pri" style="margin-top:10px" onclick="drawSafe(CUR)">Try again</button><div class="xs muted" style="margin-top:8px">For Tanner: '+esc((e&&e.message)||e)+'</div></div>';
    return false; } }

/* ---- boot: override > the saved copy (then a background refresh) > the network ---- */
/* showNoData() — first open with no saved copy and no download (or a local file with no server) */
function showNoData(){ $('v-home').innerHTML='<div class="hh"><h1>BC Powder Run</h1></div><div class="card"><h2>Couldn’t load the trip data</h2><div class="sm">This phone has no saved copy yet, and the download didn’t come through. Find some signal (wifi is best), then tap Try again. After one good open the app works offline.</div><button class="btn pri" style="margin-top:10px" onclick="location.reload()">Try again</button><div class="xs muted" style="margin-top:12px">Admin: the app reads <b>trip-data.json</b> from its own folder. Opened as a file, pick it here:</div><label class="btn" style="margin-top:6px;display:inline-flex;cursor:pointer">Choose trip-data.json<input type="file" hidden accept="application/json,.json" onchange="importData(this)"></label></div>'; }
/* showLoading() — first open: nothing saved yet, waiting for the download */
function showLoading(){ $('v-home').innerHTML='<div class="hh"><h1>BC Powder Run</h1></div><div class="card"><h2>Loading the trip data…</h2><div class="sm">The first open needs signal. After that the app works offline.</div></div>'; }
/* openData(data) — unlock (with the name + password saved on this phone) and draw Home; else the sign-in form */
async function openData(data){
  if(!data.gate){ D=data; EMB={open:{title:(D.meta||{}).title,year:(D.meta||{}).year}}; drawSafe('home'); return; }
  EMB=data; var nm=null, pw=null; try{ nm=localStorage.getItem('gname'); pw=localStorage.getItem('gpw'); }catch(e){}
  if(nm&&pw){ var err=null; try{ await gateTry(nm,pw); }catch(e){ err=e; }
    if(!err){ showNav(); drawSafe('home'); try{ loadEmg(); }catch(e){ console.error(e); } return; }
    showGate(err.message==='bad-pw'?'The trip name or password saved on this phone no longer works. Enter the current one.':gateErrText(err)); return; }
  showGate(); }
async function boot(){
  var data=null, ov=null; try{ ov=localStorage.getItem('dataOverride'); }catch(e){}
  if(ov){ try{ data=JSON.parse(ov); }catch(e){} }
  if(data){ await openData(data); return; }                           /* an admin import: no refresh, as before */
  var sv=await tdLoad();
  if(sv&&tdValid(sv.text)){ TD_TEXT=sv.text; await openData(JSON.parse(sv.text));
    if(sv.from!=='cache')tdSave(sv.text);                             /* move an old-style copy into the one saved copy */
    else{ try{ localStorage.removeItem('dataCache'); }catch(e){} }    /* the saved copy exists: the old 2.35 MB one can go */
    tdRefresh(); return; }
  showLoading();
  var tx=await tdFetch(30000,600000);                                 /* nothing else to show: a slow link gets 10 minutes */
  if(tx&&tdValid(tx)){ TD_TEXT=tx; tdSave(tx); await openData(JSON.parse(tx)); return; }
  showNoData();
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
boot();
</script>
