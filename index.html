<style>
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/space-grotesk-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/space-grotesk-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/space-grotesk-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/space-grotesk-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"Righteous";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/righteous-latin-400-normal.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--pr-paper:#FAF3D7;--pr-cream:#FBF6EC;--pr-card:#FFFCF2;--pr-ink:#241E2C;--pr-text-2:#5C5462;--pr-text-muted:#736A7B;
--pr-border:#EDE0B4;--pr-hairline:#F3EDD6;
--pr-pink:#FF4D9D;--pr-teal:#1FC9B7;--pr-purple:#8A4DEB;--pr-yellow:#FFC53D;--pr-orange:#FF8A3C;--pr-blue:#35B5E8;--pr-lime:#B8E332;
--pr-pink-text:#C4116B;--pr-teal-text:#0B6E66;--pr-purple-text:#5E2CA5;--pr-yellow-text:#7A5200;--pr-orange-text:#9C4A00;--pr-blue-text:#0E6285;--pr-lime-text:#4E6B00;
--pr-pink-tint:#FCEEF4;--pr-teal-tint:#E9F5F1;--pr-purple-tint:#F2EDFA;--pr-yellow-tint:#FBF3DA;--pr-orange-tint:#FCEFE4;--pr-blue-tint:#EAF4FB;--pr-lime-tint:#F2F7E2;
--pr-info-bg:#E9F5F1;--pr-info-text:#0B6E66;--pr-ok-bg:#F2F7E2;--pr-ok-text:#4E6B00;
--pr-warn-bg:#FFF3D2;--pr-warn-text:#7A5200;--pr-danger-bg:#FCEFE4;--pr-danger-text:#9C4A00;
--pr-card-snow-bg:var(--pr-blue-tint);--pr-card-snow-fg:var(--pr-blue-text);
--pr-card-todo-bg:var(--pr-pink-tint);--pr-card-todo-fg:var(--pr-pink-text);
--pr-card-money-bg:var(--pr-teal-tint);--pr-card-money-fg:var(--pr-teal-text);
--pr-card-stash-bg:var(--pr-purple-tint);--pr-card-stash-fg:var(--pr-purple-text);
--pr-card-meeting-bg:var(--pr-orange-tint);--pr-card-meeting-fg:var(--pr-orange-text);
--pr-card-terrain-bg:var(--pr-lime-tint);--pr-card-terrain-fg:var(--pr-lime-text);
--pr-card-warn-border:1.5px solid #C89B3C;
--pr-card-alert-border:1.5px solid #9C4A00;
--pr-link:var(--pr-pink-text);--pr-btn-primary-bg:var(--pr-pink-text);
--pr-nav-selected:var(--pr-pink-text);--pr-nav-idle:#A29AA8;
--pr-hero-bg:var(--pr-ink);--pr-hero-text:var(--pr-cream);
--pr-font-app:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
--pr-font-app-display:"Righteous","Arial Rounded MT Bold",system-ui,sans-serif;
}
body{font-family:var(--pr-font-app);background:var(--pr-paper);color:var(--pr-ink);overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
::-webkit-scrollbar{display:none}
a{color:var(--pr-link);text-decoration:none}
svg.pri{vertical-align:-0.18em;flex:0 0 auto}
.view{display:none;padding:0 16px 96px}.view.active{display:block}
.hh{padding:22px 4px 12px}
.hh h1{font-family:var(--pr-font-app-display);font-size:23px;font-weight:400;letter-spacing:.5px}
.hh h1::after{content:"";display:block;width:54px;height:5px;border-radius:3px;background:var(--pr-teal);margin-top:7px}
.hh .sub{font-size:13px;color:var(--pr-text-muted);margin-top:6px}
.card{background:var(--pr-card);border:1px solid var(--pr-border);border-radius:14px;padding:15px;margin-bottom:12px}
.card h2{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--pr-text-muted);margin-bottom:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--pr-pink-tint);color:var(--pr-pink-text)}
.pill.warn{background:var(--pr-warn-bg);color:var(--pr-warn-text)}.pill.ok{background:var(--pr-ok-bg);color:var(--pr-ok-text)}.pill.muted{background:#F1EBE0;color:var(--pr-text-2)}
.big{font-family:var(--pr-font-app-display);font-size:46px;font-weight:400;letter-spacing:1px;line-height:1;text-shadow:3px 3px 0 var(--pr-pink)}
.muted{color:var(--pr-text-muted)}.sm{font-size:13px}.xs{font-size:11.5px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 13px;border-radius:10px;border:1px solid var(--pr-border);background:var(--pr-card);color:var(--pr-ink);cursor:pointer}
.btn.pri{background:var(--pr-btn-primary-bg);color:#fff;border-color:var(--pr-btn-primary-bg)}
.lk{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--pr-border);border-radius:11px;margin-bottom:8px;background:var(--pr-card);font-size:14px;font-weight:600}
.lk small{display:block;font-weight:400;color:var(--pr-text-muted);font-size:11.5px;margin-top:1px}
.day{border-left:3px solid #E3D9C8;padding:2px 0 2px 12px;margin-bottom:14px}
.day.today{border-color:var(--pr-pink)}
.day .dt{font-size:11px;font-weight:700;color:var(--pr-text-muted);text-transform:uppercase;letter-spacing:.5px}
.day.today .dt{color:var(--pr-pink-text)}
.day .ti{font-size:15px;font-weight:700;margin-top:1px}
.tl{font-size:13px;color:var(--pr-text-2);margin-top:3px}
.inp{width:100%;border:1px solid var(--pr-border);border-radius:10px;padding:11px;font-size:15px;font-family:inherit;background:var(--pr-card);color:var(--pr-ink)}
.banner{background:var(--pr-hero-bg);color:var(--pr-hero-text);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.hero-ti{font-family:var(--pr-font-app-display);font-size:22px;font-weight:400;letter-spacing:.5px;text-shadow:2px 2px 0 var(--pr-pink)}
.card.snow{background:var(--pr-card-snow-bg)}.card.snow h2{color:var(--pr-card-snow-fg)}
.card.todo{background:var(--pr-card-todo-bg)}.card.todo h2{color:var(--pr-card-todo-fg)}
.card.money{background:var(--pr-card-money-bg)}.card.money h2{color:var(--pr-card-money-fg)}
.card.stash{background:var(--pr-card-stash-bg)}.card.stash h2{color:var(--pr-card-stash-fg)}
.card.meeting{background:var(--pr-card-meeting-bg)}.card.meeting h2{color:var(--pr-card-meeting-fg)}
.card.terrain{background:var(--pr-card-terrain-bg)}.card.terrain h2{color:var(--pr-card-terrain-fg)}
.card.snow,.card.todo,.card.money,.card.stash,.card.meeting,.card.terrain{border-color:rgba(0,0,0,.07)}
.card.snow .muted,.card.todo .muted,.card.money .muted,.card.stash .muted,.card.meeting .muted,.card.terrain .muted,.card.tint .muted{color:var(--pr-text-2)}.card.tint{background:var(--t-bg);border-color:rgba(0,0,0,.07)}.card.tint h2{color:var(--t-fg)}
.card.alertcard{background:var(--pr-danger-bg);border:var(--pr-card-alert-border)}
.stripe{height:5px;border-radius:3px;margin-top:12px;background:linear-gradient(90deg,var(--pr-pink) 0 25%,var(--pr-yellow) 25% 50%,var(--pr-teal) 50% 75%,var(--pr-purple) 75% 100%)}
.tbann{background:var(--pr-warn-bg);border:1px solid #EFD9A0;color:var(--pr-warn-text);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.soon{text-align:center;color:var(--pr-text-muted);padding:38px 16px}
.soon .ic{font-size:30px}.soon .t{font-weight:700;color:var(--pr-text-2);margin-top:8px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--pr-card);border-top:1px solid var(--pr-border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 7px;border:none;background:none;cursor:pointer;color:var(--pr-nav-idle)}
.nb .ic{height:19px;line-height:1;display:flex;align-items:center}.nb span{font-size:11px;margin-top:3px;font-weight:600}
.nb.on{color:var(--pr-nav-selected)}.nb.on span{font-weight:700}
.nb.gone{display:none} /* the Get-ready tab once the trip is under way — see readyLive() */
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--pr-ink);color:#fff;font-size:13px;padding:9px 15px;border-radius:10px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* ===================== ZONE MAP OVERLAY =====================
   Opens from Snow -> Terrain (a zone header, or any run row). Full-screen,
   sits above the nav; the Snow tab underneath is untouched. Map fills the
   stage, runs + keymap live in a drawer that collapses to give the map the
   whole screen. Solid ink chrome, no scrims, no blur (chairlift glare rule). */
#zov{position:fixed;inset:0;z-index:300;background:var(--pr-ink);display:none;--zdh:52%}
#zov.on{display:block}
#zstage{position:absolute;left:0;right:0;top:0;bottom:var(--zdh);transition:bottom .28s ease;overflow:hidden;touch-action:none}
#zpan{position:absolute;inset:0;transform-origin:0 0}
#zzoom{position:absolute;left:12px;z-index:5;display:none;align-items:center;gap:7px;
 background:var(--pr-ink);color:var(--pr-cream);border:1px solid var(--pr-text-2);
 border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
#zzoom.on{display:inline-flex}
#zzoom:active{opacity:.8}
/* mouse-driven devices can't pinch — give them buttons (and the wheel) */
#zbtns{position:absolute;right:12px;z-index:5;display:none;flex-direction:column;gap:6px}
#zbtns.on{display:none}
#zbtns button{width:36px;height:36px;border-radius:999px;background:var(--pr-cream);color:var(--pr-ink);
 border:0;font-size:17px;font-family:inherit;font-weight:600;cursor:pointer;
 display:flex;align-items:center;justify-content:center;padding:0}
#zbtns button:hover{background:#fff}
#zbtns button:active{opacity:.7}
#zbtns button:disabled{opacity:.4;cursor:default}
@media (hover:hover) and (pointer:fine){ #zbtns.on{display:flex} }
#zstage img{width:100%;height:100%;object-fit:contain;display:block}
.zhow{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px;background:var(--pr-cream);color:var(--pr-text-2);border:1px solid var(--pr-border)}
.zhow.partway{color:#0F5A85} .zhow.traverse{color:#7A5A00} .zhow.hike{color:#B5175F}
.zfrom{font-size:11px;color:var(--pr-text-2);margin-top:3px}
#zfromlift{font:600 12.5px var(--pr-font-app,inherit);padding:4px 8px;border-radius:8px;border:1px solid var(--pr-border);background:var(--pr-cream);color:var(--pr-ink);max-width:60%}
/* the 3D map (Sep 2026): for Revelstoke + Sunshine the stage shows 3d.html in a frame instead of the painted panel.
   The frame is the picture; the app's chips and run list drive it. The painted panel stays one tap away (Map). */
#z3d{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--pr-ink)}
#zstage.three #zpan{display:none} #zstage.three #z3d{display:block}
#zmode{flex:0 0 auto;display:none;border:1px solid var(--pr-text-2);border-radius:999px;overflow:hidden}
#zmode.on{display:inline-flex}
#zmode button{font-family:inherit;font-size:12px;font-weight:700;border:0;padding:6px 10px;background:var(--pr-ink);color:var(--pr-cream);cursor:pointer}
#zmode button.on{background:var(--pr-cream);color:var(--pr-ink)}
.zpulse{position:absolute;width:0;height:0;pointer-events:none;transition:left .28s ease,top .28s ease}
.zpulse i{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:3px solid var(--pr-yellow);opacity:0}
.zpulse b{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--pr-yellow);border:2px solid var(--pr-ink);opacity:0}
.zpulse.go i{animation:zring 1.15s ease-out 2}
.zpulse.go i:nth-child(2){animation-delay:.3s}
.zpulse.go b{animation:zdot 2.4s ease-out 1}
@keyframes scpulse{0%{opacity:.95;r:8px}100%{opacity:0;r:26px}}.pring.pulsing{animation:scpulse 1.1s ease-out 2}@keyframes scyou{0%{r:8px;opacity:.9}70%{r:22px;opacity:0}100%{r:22px;opacity:0}}.youring{animation:scyou 1.8s ease-out infinite}
@keyframes zring{0%{transform:scale(.4);opacity:0}20%{opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes zdot{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}
/* Access + egress routes are LINES, not points, so their pulse is an SVG
   polyline laid over the crop in the same letterboxed rect the pins use.
   Strokes carry vector-effect:non-scaling-stroke — a pinch magnifies the map
   but never the line. The counter-scale trick .zpulse uses can't do that. */
#zsvg{position:absolute;pointer-events:none;overflow:visible;z-index:3}
#zsvg path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#zsvg .halo{stroke:var(--pr-ink);stroke-width:8;opacity:.30}
#zsvg .core{stroke:var(--pr-pink);stroke-width:3.5}
#zsvg g.go .core{stroke-dasharray:11 8;animation:zdash 1.05s linear infinite}
#zsvg g.go .halo{animation:zhalo 1.2s ease-out 3}
/* endpoint dot carries the KIND: hollow = way in, filled = way out.
   (dashes are taken — they mean "this route is selected".) */
#zsvg circle{fill:var(--pr-card);stroke:var(--pr-ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
#zsvg g.out circle{fill:var(--pr-pink)}
@keyframes zdash{to{stroke-dashoffset:-38}}
@keyframes zhalo{0%{opacity:.55}100%{opacity:.16}}
.zrr.rtrow .zd{border-radius:2px;width:14px;height:5px;background:var(--pr-card);border:1px solid var(--pr-ink)}
.zrr.rtrow.out .zd{background:var(--pr-pink)}
#ztop{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;gap:8px;align-items:center;
 padding:9px 12px;padding-top:calc(9px + env(safe-area-inset-top));
 background:var(--pr-ink);border-bottom:3px solid var(--pr-teal)}
#ztop .zx{flex:0 0 auto;width:32px;height:32px;border-radius:999px;background:var(--pr-cream);color:var(--pr-ink);
 border:0;font-size:14px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}
#ztop .zx:active{opacity:.7}
#zchips{display:flex;gap:6px;overflow-x:auto;flex:1}
#zchips button{white-space:nowrap;font-family:inherit;font-size:12.5px;font-weight:600;border:0;border-radius:999px;
 padding:7px 12px;background:var(--pr-cream);color:var(--pr-text-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
#zchips button.on{background:var(--pr-btn-primary-bg);color:#fff}
#zchips button:active{opacity:.8}
#zreflash{position:absolute;left:50%;margin-left:-40vw;width:80vw;justify-content:center;z-index:5;display:none;
 align-items:center;gap:9px;background:var(--pr-ink);color:var(--pr-cream);border:1px solid var(--pr-text-2);
 border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
#zreflash.on{display:flex}
#zreflash:active{opacity:.8}
#zreflash .zrd{width:10px;height:10px;border-radius:50%;background:var(--pr-yellow);flex:0 0 auto}
#zreflash .zrn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zdrawer{position:absolute;left:0;right:0;bottom:0;height:var(--zdh);z-index:6;background:var(--pr-card);
 border-top:1px solid var(--pr-border);border-radius:14px 14px 0 0;transition:height .28s ease;
 overflow:hidden;display:flex;flex-direction:column}
#zdrawer .zgrab{position:absolute;top:3px;left:50%;margin-left:-10px;width:20px;height:15px;
 line-height:15px;text-align:center;font-size:12px;color:var(--pr-text-muted);
 z-index:2;pointer-events:none;transition:transform .28s}
#zdrawer.shut .zgrab{transform:rotate(180deg)}
#zbar{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:17px 16px 10px;cursor:pointer}
#zbar .zdt{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zbar .zdg{font-size:11.5px;font-weight:700;background:var(--pr-danger-bg);color:var(--pr-danger-text);
 padding:2px 8px;border-radius:999px;display:none;align-items:center;gap:4px}
#zbar .zdg.on{display:inline-flex}
#zbody{flex:1;overflow-y:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom));opacity:1;transition:opacity .16s}
#zdrawer.shut #zbody{opacity:0;pointer-events:none;overflow:hidden}
.zrow{display:flex;gap:12px;padding:0 16px;align-items:flex-start}
.zrow .znote{flex:1;min-width:0}
.zrow .znote .zsub{font-size:11.5px;color:var(--pr-text-2);line-height:1.5}
.zrow .zkey{flex:0 0 44%;border:1px solid var(--pr-border);border-radius:11px;overflow:hidden;line-height:0}
.zrow .zkey img{width:100%;display:block}
.zgroup{padding:14px 16px 2px}
.zgroup label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--pr-text-2)}
.zgroup input{width:18px;height:18px;accent-color:var(--pr-btn-primary-bg);cursor:pointer;margin:0;flex:0 0 auto}
.zruns{padding:2px 16px 0}
.zruns .zlab{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--pr-text-2);
 margin:13px 0 7px;display:flex;align-items:center;gap:7px}
.zruns .zlab .zct{background:var(--pr-yellow-tint);color:var(--pr-yellow-text);border-radius:999px;
 padding:2px 8px;font-size:11.5px;letter-spacing:0}
.zrr{display:flex;align-items:center;gap:10px;border:1px solid var(--pr-border);background:var(--pr-card);
 border-radius:11px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
.zrr:active{opacity:.7}
.zrr.on{border:1.5px solid var(--pr-btn-primary-bg)}
.zrr .zd{width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--pr-text-2);border:1px solid var(--pr-ink)}
.zrr .znm{font-size:13px;font-weight:600;flex:1}
.zrr .zzt{font-size:11.5px;font-weight:600;color:var(--pr-text-muted)}
.lv-expert .zd,.lv-adv .zd{background:var(--pr-ink)}
.lv-extreme .zd{background:var(--pr-orange)}
.lv-int .zd{background:var(--pr-blue)}
.lv-beginner .zd,.lv-novice .zd{background:var(--pr-lime)}
.lv-info .zd,.lv-n\/a .zd{background:var(--pr-card);border-style:dashed}
.zrr .zsb{font-size:11px;font-weight:400;color:var(--pr-text-2);margin-top:2px;line-height:1.45}
.kind{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;flex:0 0 auto}
.kind.cruiser{background:var(--pr-lime-tint);color:var(--pr-lime-text)}
.kind.stop{background:var(--pr-teal-tint);color:var(--pr-teal-text)}
.kind.view{background:var(--pr-teal-tint);color:var(--pr-teal-text)}
.k-cruiser .zd{background:var(--pr-lime)}
.k-stop .zd{background:var(--pr-teal)}
.k-view .zd{background:var(--pr-teal)}
/* ---- picks UI (v.69.10) ---------------------------------------------
   The drawer is now three blocks: the ranked picks, the cruiser itinerary,
   and everything else behind a disclosure. Unpinned runs render too — they
   just get a dashed dot and don't try to flash. */
.zrr.pk{border-color:var(--pr-yellow);background:var(--pr-yellow-tint);align-items:flex-start}
.zrr.pk.on{border:1.5px solid var(--pr-btn-primary-bg)}
.zrk{flex:0 0 auto;min-width:21px;height:21px;border-radius:999px;background:var(--pr-ink);
 color:var(--pr-cream);font-size:11px;font-weight:700;display:flex;align-items:center;
 justify-content:center;padding:0 5px;margin-top:1px}
.znum{flex:0 0 auto;min-width:23px;height:19px;border-radius:5px;border:1px solid var(--pr-ink);
 background:var(--pr-card);color:var(--pr-ink);font-size:11px;font-weight:700;

   Same tap-to-open setup as the zone maps: tap the Scene map card, the map

#stopbar{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;gap:8px;align-items:center;

 background:var(--pr-ink);border-bottom:3px solid var(--pr-pink)}
#stopbar .zx{flex:0 0 auto;width:32px;height:32px;border-radius:999px;background:var(--pr-cream);color:var(--pr-ink);

#schips{display:flex;gap:6px;overflow-x:auto;flex:1}

 padding:7px 12px;background:var(--pr-cream);color:var(--pr-text-2);cursor:pointer}

#schips button:active{opacity:.8}
#szoom{position:absolute;left:12px;z-index:5;display:none;align-items:center;gap:7px;
 background:var(--pr-ink);color:var(--pr-cream);border:1px solid var(--pr-text-2);
 border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}

#szoom:active{opacity:.8}

/* ===================== HOME (Sep 2026 redesign) =====================
   Phone-first styles for the new Home cards. Everything here is flat: tint +
   border, no shadows (design-system rule). Desktop tweaks live in the
   min-width:900px block further down. */
/* stats strip: on a phone it's a compact 4-up row on the paper, right under
   the countdown (setView lifts it into .heroin on every width) */
.hstats{display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px 14px;color:var(--pr-ink)}
.hstats .v{font-family:var(--pr-font-app-display);font-size:22px;line-height:1}
.hstats .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--pr-text-muted);margin-top:4px}
/* milestones timeline under the countdown: a scrolling row of dots on a line */
.milest{--m-line:var(--pr-border);--m-text:var(--pr-text-2);--m-ink:var(--pr-ink);--m-paper:var(--pr-paper);margin:0 0 12px}
/* the row is the scroller: it runs edge to edge under the 16px page gutters, so an
   item is only ever cut by the screen edge (a scroll cue), never by the gutter */
.milest .mrow{display:flex;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.milest .mi{flex:0 0 150px;width:150px;position:relative;padding:0 12px 0 0;color:var(--m-text)}
.milest .mi::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--m-line)}
.milest .mi:first-child::before{left:7px}.milest .mi:last-child::before{right:auto;width:7px}
.milest .md{position:relative;z-index:1;width:16px;height:16px;border-radius:99px;background:var(--m-paper);border:2px solid var(--m-line);display:flex;align-items:center;justify-content:center;color:var(--pr-lime-text)}
.milest .mi.past .md{background:var(--pr-lime-tint);border-color:var(--pr-lime-text)}
.milest .mi.next .md{background:var(--pr-pink);border-color:var(--pr-pink-text)}
.milest .mw{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:6px;color:var(--m-text)}
.milest .mt{font-size:12px;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.milest .mi.past{opacity:.6}.milest .mi.past .mt{text-decoration:line-through}
.milest .mi.next{color:var(--m-ink)}.milest .mi.next .mt{font-weight:700}
.milest .mi.next .mw{color:var(--pr-pink-text)}
/* powder alert — the one loud card: snow tint, full 1.5px border, a solid neon
   teal header band (core-four colour; a solid fill, not a Memphis motif, so the
   countdown stripes stay the screen's single Memphis element) */
.card.pow{border:1.5px solid var(--pr-blue-text);background:var(--pr-card-snow-bg);overflow:hidden;padding-top:0}
.card.pow .powhd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -15px 10px;padding:8px 15px;background:var(--pr-teal);color:var(--pr-ink)}
.card.pow .powhd h2{margin:0;color:var(--pr-ink);display:flex;align-items:center;gap:6px}
.card.pow .powhd .when{font-size:11px;font-weight:700;letter-spacing:.3px}
.card.pow .prow{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid rgba(14,98,133,.14)}
.card.pow .prow:last-of-type{border-bottom:none}
.card.pow .prow .pn{flex:1;min-width:0}
.card.pow .prow .ph{font-weight:700;font-size:15px}
.card.pow .prow.lead .ph{font-size:17px}
.card.pow .prow .pj{font-size:12.5px;color:var(--pr-text-2);margin-top:1px}
.card.pow .prow .pin{font-family:var(--pr-font-app-display);font-size:22px;line-height:1;color:var(--pr-blue-text);white-space:nowrap}
.card.pow .prow.lead .pin{font-size:30px;text-shadow:2px 2px 0 var(--pr-teal)}
.card.pow .prow .ptag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--pr-blue-text);margin-left:6px}
#powslot:empty{display:none}
/* get-ready one-liner (pink to-do card, tappable) */
.card.ready{cursor:pointer;padding:12px 15px}
.card.ready .rnext{font-size:12.5px;color:var(--pr-text-2);margin-top:3px}
.card.ready .chev{font-size:20px;line-height:1;color:var(--pr-pink-text);padding-left:4px}
/* snow-so-far table: dense 13px rows, numbers right-aligned, hairline dividers */
.sft{display:grid;grid-template-columns:minmax(0,1fr) 44px 52px 80px 44px;column-gap:0;align-items:stretch;font-size:13px}
.sft.off{grid-template-columns:minmax(0,1fr) 96px 44px}
.sft>div{padding:6px 0;border-bottom:1px solid rgba(14,98,133,.12);min-width:0;display:flex;flex-direction:column;justify-content:center}
.sft>div.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.sft>div.hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--pr-blue-text);padding:0 0 5px}

<script>
var ZRT=-1;
var D=null, EMB=null, GATEKEY=null, DATAKEY=null, LEGACYKEY=null, CUR='home', SCENE_TOWN=null, TMODE={}, PAST_OPEN={}, DS_N=0, GEOW=null, GEOPOS=null;
function b64d(x){var b=atob(x),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function b64e(buf){ var a=new Uint8Array(buf),x=''; for(var i=0;i<a.length;i++)x+=String.fromCharCode(a[i]); return btoa(x); }
function normName(x){return (x||'').toLowerCase().split(/\s+/).filter(Boolean).join(' ');}
/* gateOpen(emb,name,pw) — unlock one sealed trip-data file. Returns {d, key}; changes nothing global.
   Errors carry a plain code: 'bad-pw' ONLY when the decryption itself fails (the one case that means a wrong trip name
   or password), 'no-sc' when this browser has no WebCrypto. Anything else is a real bug and keeps its own message.
   (The background refresh uses it to unlock a newer copy without touching the one on screen.) */
async function gateOpen(emb,name,pw){ if(!(window.crypto&&crypto.subtle))throw new Error('no-sc'); var g=emb.gate;
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(normName(name)+'|'+pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(g.salt),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt','encrypt']);
  var pt; try{ pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(g.iv)},key,b64d(g.ct)); }catch(e){ throw new Error('bad-pw'); }
  return {d:JSON.parse(new TextDecoder().decode(pt)), key:key}; }
async function gateTry(name,pw){ var o=await gateOpen(EMB,name,pw); D=o.d; GATEKEY=o.key; await initDataKey(); return true; }
/* gateErrText(e) — what the sign-in form says when unlocking failed. M9: "Wrong trip name or password" only for a
   real decryption failure — never for a crash somewhere else. */
function gateErrText(e){ var m=e&&e.message;
  if(m==='bad-pw')return 'Wrong trip name or password.';
  if(m==='no-sc')return 'This browser can’t unlock — use Safari/Chrome over https.';
  console.error('Unlock failed (not a password problem):',e);
  return 'Couldn’t open the trip data on this phone. Close the app, open it again, and try once more.'; }
/* showNav() — the bottom tab bar (hidden while the sign-in form shows) */
function showNav(){ var nav=document.querySelector('.bnav'); if(nav)nav.style.display=''; }

/* ---- data key: crew-submitted stuff, decoupled from the gate password ----
   Emergency records and shared files USED to be encrypted with the key derived
   from the gate password, which meant changing that password silently orphaned
   every one of them. They are now encrypted with a random key that lives INSIDE
   the encrypted trip data, so the gate password can be rotated freely.
   LEGACYKEY keeps anything submitted before this change readable, so nothing is
   lost on the way over. */
async function initDataKey(){
  LEGACYKEY=GATEKEY; DATAKEY=null;
  var raw=D&&D.dataKey;
  if(raw){ try{ DATAKEY=await crypto.subtle.importKey('raw',b64d(raw),{name:'AES-GCM'},false,['encrypt','decrypt']); }catch(e){ DATAKEY=null; } }
  if(!DATAKEY) DATAKEY=GATEKEY;   /* older data file with no dataKey: behave exactly as before */
}
async function dkDecrypt(ivb,datab){
  try{ return await crypto.subtle.decrypt({name:'AES-GCM',iv:ivb},DATAKEY,datab); }
  catch(e){ if(LEGACYKEY&&LEGACYKEY!==DATAKEY) return await crypto.subtle.decrypt({name:'AES-GCM',iv:ivb},LEGACYKEY,datab); throw e; }
}
function showGate(err){ var nav=document.querySelector('.bnav'); if(nav)nav.style.display='none';
  var o=(EMB&&EMB.open)||{}, h='<div class="hh" style="margin-top:26px"><h1>'+esc(o.title||'Trip')+' '+esc(o.year||'')+'</h1><div class="sub">Crew only — the trip name &amp; password came from the group chat</div></div>';
  h+='<div class="card"><h2>Sign in once on this phone</h2>';
  h+='<div class="xs muted" style="margin:4px 0 2px">Trip name</div><input class="inp" id="gname" autocomplete="off" placeholder="the trip name">';
  h+='<div class="xs muted" style="margin:10px 0 2px">Trip password</div><input class="inp" id="gpw" type="password" placeholder="password">';
  h+=(err?'<div class="xs" style="margin-top:8px;color:var(--pr-danger-text);font-weight:700">'+esc(err)+'</div>':'');
  h+='<button class="btn pri" style="width:100%;justify-content:center;margin-top:12px" onclick="gateSubmit()">Unlock the app</button>';
  h+='</div>';
  h+='<div class="card alertcard"><div class="between"><h2 style="margin:0;color:var(--pr-danger-text)">'+ic('alert',13)+' Emergency</h2><a class="btn" href="tel:911" style="border-color:var(--pr-danger-text);color:var(--pr-danger-text);font-weight:700">911</a></div></div>';
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  $('v-home').classList.add('active'); $('v-home').innerHTML=h;
}
async function gateSubmit(){ var nm=($('gname')||{}).value||'', pw=($('gpw')||{}).value||'';
  if(!nm||!pw){ showGate('Both fields, ya donkey.'); return; }
  try{ await gateTry(nm,pw); }catch(e){ showGate(gateErrText(e)); return; }   /* only a failed unlock lands here */

   (one copy for the app and the game page). It is worked out once per data key after unlock and kept
   in memory only. Old data with no dataKey → '' → no k is sent (the script accepts that until Nov 30, 2026). */
function crewToken(){ return gnarCrewToken(D&&D.dataKey); }
/* crewGet(url) — GET with &k=… added; resolves to the parsed JSON answer (rejects with no signal) */
function crewGet(url){ return crewToken().then(function(k){ return fetch(gnarWithK(url,k)); }).then(function(x){ return x.json(); }); }

   first and carry a small "not uploaded yet" tag. They are sent, and they leave the queue only when the
   server's own list shows them (a pick by its ts, an emergency save by the id sealed inside it).
   Retries are quiet (no toasts, no full redraws) and back off: 30 s, 1 min, 2 min, then every 5 min.
   They go at once when the phone comes back online, when the app opens and when you come back to it.

   G.N.A.R. claims follow the same rule inside gnar.html. */

  cv.forEach(function(c,i){ if(r<0&&i!==h&&c&&c.callFirst)r=i; });
  cv.forEach(function(c,i){ if(r<0&&i!==h&&c)r=i; });
  return {h:h,r:r}; }
/* what each box starts with (blank for a new card; the rescue CALL-FIRST tick starts on, as before) */

    rCo:rc?String(rc.name||''):'', rId:rc?String(rc.policy||''):'', rPh:rc?String(rc.phone||''):'', rCf:rc?!!rc.callFirst:true, split:sp }; }

/* submitEmg() — save the form: build the card, refuse a save that would erase it, encrypt, queue, send.
   - No emergency contact and no coverage line → refused (that would wipe the card on every phone).
   - A CALL-FIRST line on file that would go (or lose CALL FIRST) → asked first, by name.
   - Boxes left as they were keep that line exactly as on file (its notes, proof doc and fine print).
   The save waits in 'emgQueue' until the server's list shows it (see Outbox). */
async function submitEmg(){
  var card=emgCardEl(); function q(id){ return card?card.querySelector('#'+id):$(id); }
  var msgEl=q('emgmsg'); function stop(m){ if(msgEl)msgEl.textContent=m; toast(m); }
  if(msgEl)msgEl.textContent='';
  var who=(q('emWho')||{}).value||''; if(!who){ stop('Pick your name first.'); return; }
  function v(id){ return ((q(id)||{}).value||'').trim(); }
  function on(id){ return !!((q(id)||{}).checked); }

  function slot(o,isH){ var co=v(isH?'emHco':'emRco'), id=v(isH?'emHid':'emRid'), ph=v(isH?'emHph':'emRph'), cf=on(isH?'emHcf':'emRcf');

    if(o&&co===pco&&id===pid&&ph===pph&&cf===pcf)return o;   /* untouched: keep the line exactly */
    var out=Object.assign({},o||{});

    if(!o||id!==pid)out.policy=id?(isH?'Member ID '+id:id):'';
    out.phone=ph;
    if(!o||cf!==!!o.callFirst){ out.callFirst=cf;
      out.note=cf?(isH?'Call them before non-life-threatening treatment or any transport decisions.':'They must be called BEFORE any rescue/evac is arranged — no call = not covered.'):'Pay out of pocket, keep every receipt, claim after.'; }
    return out; }
  var hNew=slot(sp.h>=0?orig[sp.h]:null,true), rNew=slot(sp.r>=0?orig[sp.r]:null,false), keep={};

  if(sp.r<0&&rNew)covs.push(rNew);

  if(!ice.name&&!ice.phone&&!covs.length){ stop('Add an emergency contact or a coverage line first. Saving empty boxes would erase '+(who===me?'your':who+'’s')+' card on every phone.'); return; }

    else if(!now.callFirst){ if(!confirm((o.name||'This line')+' is a CALL-FIRST line. Save it without CALL FIRST?')){ stop('Nothing saved.'); return; } } }

  var typed={allergies:v('emAll'),meds:v('emMed'),blood:v('emBld'),notes:v('emNts')};
  var med=(e&&e.medical&&!on('emMclr'))?Object.assign({},e.medical):{};

  var em=Object.assign({},e||{}); delete em.medical; delete em.placeholder; delete em.pending;

/* share a file: encrypted on the phone with the crew key, then sent with the crew token. Not queued

/* ===================== ZONE MAP OVERLAY =====================
   Pre-cut zone crops (spotlight dim baked in at build time) + a pre-baked
   keymap per sheet. No pan/zoom engine, no fly-to: tap a run, the crop for
   its zone comes up and a ring pulses where the run is. The pulse is
   deliberately forgiving, so pins only have to be roughly right.
   Data lives on each terrain zone as z.zmap {img,key,asp,sheet,gated,entry,note}
   and on each run as r.x / r.y / r.lift (+ r.approx when the sheet doesn't
   name the line). A zone with no zmap simply renders as it always has. */
var ZR=null, ZI=0, ZRUN=-1, ZSHUT=false, ZBYLIFT=false, ZBYBOWL=false, ZPULSE=null, ZOPEN=false, ZPUSHED=false;

/* "Cruisers only" is ONE state per resort (TMODE[rid]), shared by the Snow-tab
   checkbox and the drawer checkbox — tick either and both follow. For runs,
   level is the only trustworthy signal: r.type is free text with 130+ distinct
   values. POIs carry an explicit kind and are mellow by definition. */
function isMellowRun(r){ return r.cruiser===true||r.kind==='cruiser'||r.kind==='stop'||r.kind==='view'
  ||r.level==='int'||r.level==='beginner'; }
function cruisersOn(k){ return TMODE[k]==='mellow'; }
function zKeep(r){ return !cruisersOn(ZR)||isMellowRun(r); }

/* Map POIs (lodges, viewpoints, the curated cruisers that aren't zone runs) stay
   in their own arrays — cabins/woods/cruisers — and get pinned by adding
   zone + x + y + kind + lift to the entry. No content is duplicated. A zone's
   item list is its runs followed by its POIs; that index is what zOpen() takes. */
function zPois(t,zname){ var out=[];
  ['cruisers','cabins','woods'].forEach(function(src){ ((t||{})[src]||[]).forEach(function(p){
    if(p.zone===zname&&p.x!=null&&p.y!=null)out.push(p); }); });
  return out; }
/* F/R17 (Sep 24 2026): rows marked hide:true (duplicates, "moved" rows, trail-map labels that aren't runs) stay in
   the data but never reach the crew. Everything indexes through zItems(), so the filter is in one place. */
function zItems(t,z){ return (z.runs||[]).filter(function(r){ return !r.hide; }).concat(zPois(t,z.name)); }
function zList(){ var z=zZone(); return z?zItems((D.terrain||{})[ZR],z):[]; }

  var el=$('terr-'+k); if(el&&el.style.display!=='none')el.innerHTML=terrainHtml((D.terrain||{})[k],TMODE[k],k);
  if(ZOPEN&&ZR===k){
    var cb=$('zcruise'); if(cb)cb.checked=on;
    var it=zList()[ZRUN];
    if(ZRUN>=0&&it&&!zKeep(it)){ ZRUN=-1; zClearPulse(); }
    zChips(); zRenderRuns();

}
function zHasMap(z){ return !!(z&&z.zmap&&z.zmap.img); }
function zMapZones(k){ var t=(D.terrain||{})[k]||{}; return (t.zones||[]).filter(zHasMap); }
function zZone(){ return zMapZones(ZR)[ZI]; }

/* ---- 3D pilot (Sep 2026): a sealed 3D bundle exists for these resorts in maps/3d/.
   3d.html unlocks it with the same trip phrase (read from this origin's localStorage).
   Zone ids there are the zone name slugged the same way build_furniture_gpkg.py does. */
var BUNDLES3D={revelstoke:1,sunshine:1,kickinghorse:1,panorama:1,louise:1,norquay:1,whitewater:1,schweitzer:1,red:1};   /* Sep 5: the seven hills land here as each is built */
function z3dSlug(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48); }
/* Sep 5: every 3D bundle has a build stamp in trip-data (maps3d, written by scripts/stamp_bundles.py). It rides on the
   3d.html address as &v= and is left in localStorage, so 3d.html can fetch maps/3d/<m>.bundle?v=<stamp> — a NEW address
   for a rebuilt bundle, which is the only way past the service worker's cache-first rule for /maps/. */
function z3dV(k){ var v=z3dStamp(k); try{ if(v)localStorage.setItem('pr3d-v-'+k,v); }catch(e){} return v?'&v='+encodeURIComponent(v):''; }
/* z3dStamp(k) — hill k's 3D fingerprint (Sep 24 2026): its build stamp, "YYYYMMDDTHHMMSS". Two scripts write it —
   stamp_bundles.py into maps3d, stamp_map_fingerprints.py into mapsFp (as maps/3d/<k>.bundle) — so the LATER stamp
   wins: whichever ran last after a hill rebuild, phones get the new bundle. The service worker keeps one copy per
   bundle piece and swaps it only when this stamp changes (with no signal it keeps using the old one). */
function z3dStamp(k){ var a=((D&&D.maps3d)||{})[k]||'', b=((D&&D.mapsFp)||{})['maps/3d/'+k+'.bundle']||''; return a>b?a:b; }
function z3dUrl(k,zoneName,runName){ return '3d.html?m='+encodeURIComponent(k)+'&zone='+encodeURIComponent(z3dSlug(zoneName))+(runName?'&q='+encodeURIComponent(runName):'')+z3dV(k); }
/* ---- the 3D frame (Sep 4 2026): "replace the snow tab terrain drawer maps with our sick 3d map" ----
   3D is the standard for a resort with a bundle; the painted panel is one tap away (Map) and comes back by itself when
   you tap a run that has no 3D line yet. The frame is 3d.html?embed=1 — no chips, no drawer of its own — and talks over
   postMessage: we send {t:'zone'} / {t:'select', name} / {t:'clear'}; it answers {t:'ready', names} / {t:'selected'} / {t:'nomatch'}. */

function z3dOn(){ return !!(BUNDLES3D[ZR]&&Z3D.mode==='3d'); }

  st.classList.toggle('three',on);

  if(on){ var z=zZone(), zid=z?z3dSlug(z.name):'';
    if(Z3D.m!==ZR){ Z3D.m=ZR; Z3D.ready=false; Z3D.names={}; Z3D.queue=[];
      /* a fresh frame each time the resort changes, with its address set BEFORE it joins the page: changing a live frame's
         address adds a browser-history entry, and the overlay's back-button handling would trip over it */
      if(f)f.parentNode.removeChild(f); f=document.createElement('iframe'); f.id='z3d'; f.title='3D map'; f.setAttribute('allow','geolocation');

}
/* z3dWatch(f,k) — M13/R20: when the 3D page can't load its mountain (no signal and not saved on this phone, or the
   3D page itself isn't here), go back to the flat Map view and say why, instead of a blank frame or an error inside it.
   3d.html posts nothing when it fails; it writes the reason into its #gerr line. The frame is on this same site, so

/* the crop is object-fit:contain, so a percentage pin lands in the letterbox.

function zRect(){

/* ================= routes =================

  (t.routes||[]).forEach(function(rt,i){ if(rt.path&&rt.path.length>1&&(!rt.zone||rt.zone===z.name))out.push([rt,i]); });
  return out;
}

  s.style.left=r.ox+'px'; s.style.top=r.oy+'px'; s.style.width=r.rw+'px'; s.style.height=r.rh+'px';

/* ---- test mode: getNow() drives all date logic ---- */

/* ---- date helpers (all via getNow) ---- */
function dObj(s){return new Date(s+(s.length<=10?'T12:00:00':''));}
function fmtShort(s){return dObj(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function nowMid(){var n=getNow();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),12);}
function daysUntilStart(){return Math.ceil((dObj(D.meta.start)-nowMid())/864e5);}
function tripDayIdx(){var d=Math.floor((nowMid()-dObj(D.meta.start))/864e5); if(d<0)return -1; if(d>=D.days.length)return -2; return d;}
var GROUPACC={sunshine:'banff',norquay:'banff',louise:'banff',panorama:'panorama',kickinghorse:'kickinghorse',revelstoke:'revelstoke',whitewater:'whitewater',red:'red',schweitzer:'schweitzer'};
var STOPACC={banff:'banff',invermere:'panorama',golden:'kickinghorse',revelstoke:'revelstoke',nelson:'whitewater',rossland:'red',sandpoint:'schweitzer'};
var ACCENTS={banff:['var(--pr-pink)','var(--pr-pink-text)'],panorama:['var(--pr-purple)','var(--pr-purple-text)'],kickinghorse:['var(--pr-orange)','var(--pr-orange-text)'],revelstoke:['var(--pr-blue)','var(--pr-blue-text)'],whitewater:['var(--pr-lime)','var(--pr-lime-text)'],red:['var(--pr-teal)','var(--pr-teal-text)'],schweitzer:['var(--pr-yellow)','var(--pr-yellow-text)']};

function jumpGroup(g){ var el=$('dayg-'+g); if(el)el.scrollIntoView({behavior:'smooth',block:'start'}); }
function resortOfDay(day){return day.rid?D.resorts[day.rid]:null;}
var TICKET_R={kickinghorse:1,whitewater:1}, PASSTOT={banff:5,panorama:5,revelstoke:5,red:5,schweitzer:5}, PASSNAME={banff:'SkiBig3',panorama:'Panorama',revelstoke:'Revelstoke',red:'RED',schweitzer:'Schweitzer'};
function skiGroupOf(day){ if(!day||!day.ski)return null; if(day.skiSwitch&&!skiSwitchOn(day))return null; var r=groupRid(day); if(r&&TICKET_R[r])return null; var g=r?GROUPACC[r]:(day.stop==='banff'?'banff':null); return g||null; }

/* ---- nav ---- */
/* readyLive() — is the Get-ready tab in play? True pre-trip and on fly-in day
   (Feb 5, tripDayIdx()===0): that's when the checklist, packing list and
   emergency form matter as a set. From the first Banff day on — and after the
   trip — the tab is gone from both navs, packing + the form go back to More
   exactly where they used to live, and the pre-trip checklist is retired.
   Used by syncNav(), sw()/render(), rHome(), rMore(), crewCard()/deskCrew()
   and hurtHtml(). Change the rule here and everything follows. */
function readyLive(){ var i=tripDayIdx(); return i===-1||i===0; }
/* formView() — which view holds "My emergency info" right now */
function formView(){ return readyLive()?'ready':'more'; }
/* syncNav() — show/hide the Get-ready tab in the bottom nav (and the desktop top bar, same buttons) */
function syncNav(){ var b=document.querySelector('.nb[data-t="ready"]'); if(b)b.classList.toggle('gone',!readyLive()); }
/* sw(view) — switch views. 'ready' is a real tab while readyLive(); once it's
   gone, asking for it lands on More (no error, nothing left lit that shouldn't be). */
function sw(v){if(!D)return; if(v==='ready'&&!readyLive())v='more'; if(v!=='scene')scGeoStop(); CUR=v; var vs=document.querySelectorAll('.view'); for(var i=0;i<vs.length;i++)vs[i].classList.remove('active'); $('v-'+v).classList.add('active'); var nb=document.querySelectorAll('.nb'); for(var j=0;j<nb.length;j++)nb[j].classList.toggle('on',nb[j].dataset.t===v); window.scrollTo(0,0); render(v);}
function render(v){ prepDays(); syncNav(); LASTDAY=nowMid().getTime(); if(v==='ready'&&!readyLive()){ sw('more'); return; } ({home:rHome,days:rDays,snow:rSnow,drive:rDrive,scene:rScene,more:rMore,ready:rReady})[v](); }

/* ---- R39 (Sep 24 2026): the Banff "pick" days ----
   Feb 9 is the girls' pick (Sunshine or Lake Louise) and Feb 10 is "the other one" for the guys.
   In the data: the Feb 9 day has  choice:['sunshine','louise']  and  pick:null ; the Feb 10 day has
   choiceOf:<index of Feb 9>. When the girls decide, ONE data change sets pick:'louise' (or 'sunshine')
   and both days follow for every phone. prepDays() runs before every draw and fills in, for both days:
     day.opts — the two options (so the app can show both day sheets while the pick is open)
     day.rid  — the resolved mountain, or nothing while the pick is open. */
function prepDays(){ var ds=(D&&D.days)||[];
  ds.forEach(function(d){
    if(d.choice){ d.opts=d.choice; d.rid=(d.pick&&d.choice.indexOf(d.pick)>=0)?d.pick:undefined; }
    else if(d.choiceOf!=null){ var s=ds[d.choiceOf]; if(s&&s.choice){ d.opts=s.choice;
      d.rid=(s.pick&&s.choice.indexOf(s.pick)>=0)?s.choice.filter(function(x){ return x!==s.pick; })[0]:undefined; } } }); }
/* choiceSrc(day) — the Feb 9 day (it holds the pick and the notes) for either pick day, else null */
function choiceSrc(day){ if(!day)return null; if(day.choice)return day; if(day.choiceOf!=null)return (D.days||[])[day.choiceOf]||null; return null; }
/* choiceLine(day) — "Sunshine or Lake Louise — the girls pick Feb 9" while the pick is open, else '' */
function choiceLine(day){ if(!day||!day.opts||day.rid)return ''; var s=choiceSrc(day);
  return day.opts.map(shortName).join(' or ')+(day.choice?' — the girls pick':' — whichever the girls didn’t pick on '+(s?fmtShort(s.dt):'Feb 9')); }
/* gatedNote(i) — the Delirium Dive / Wild West note belongs to the guys' LAST Sunshine day:
   Feb 9 if the girls pick Sunshine, Feb 10 if they pick Louise; while the pick is open, both days show it
   as "if this is the Sunshine day". */
function gatedNote(i){ var day=(D.days||[])[i], s=choiceSrc(day); if(!s||!s.sunshineLast)return '';
  if(!s.pick)return 'If it’s Sunshine: '+s.sunshineLast;
  var si=D.days.indexOf(s), other=null; D.days.forEach(function(d){ if(d.choiceOf===si)other=d; });
  var lastSun=(s.pick==='sunshine')?s:other;   /* girls pick Sunshine → everyone skis it Feb 9; else the guys ski it Feb 10 */
  return (lastSun===day)?s.sunshineLast:''; }
/* groupRid(day) — the resort that sets a day's colour and IKON pass group; a pick day counts as its
   first option (both options are SkiBig3) */
function groupRid(day){ return day.rid||((day.opts&&day.opts[0])||null); }

/* ---- R40 (Sep 24 2026): the Feb 21 "Ski this morning?" switch ----
   The call is made that morning, too late for a data update, so each phone keeps its own answer
   (localStorage skiSwitch-<date>). No is the default. The day's skiSwitch in the data holds the
   question and the two plans. */
function skiSwitchOn(day){ try{ return localStorage.getItem('skiSwitch-'+day.dt)==='yes'; }catch(e){ return false; } }
function setSkiSwitch(dt,yes){ try{ localStorage.setItem('skiSwitch-'+dt,yes?'yes':'no'); }catch(e){} render(CUR); if(SOPEN&&SMODE==='day')dsSetDay(SDAY); }
function skiSwitchHtml(day,dark){ var s=day&&day.skiSwitch; if(!s)return ''; var y=skiSwitchOn(day);
  var on='background:var(--pr-btn-primary-bg);color:#fff;border-color:var(--pr-btn-primary-bg);font-weight:700', off=dark?'background:transparent;color:#FBF6EC;border-color:#5B5368':'';
  return '<div style="margin-top:9px;border:1px solid '+(dark?'#3A3346':'var(--pr-hairline)')+';border-radius:11px;padding:9px 10px">'

/* =========================== HOME CARDS (Sep 2026) ===========================
   Every function below builds ONE card for the Home tab and returns an HTML
   string; rHome() strings them together in the order the crew sees them.
   Cards that need the network render a placeholder first and fill themselves
   in when the cache or the fetch comes back — Home never waits on a request,
   and a failed request never throws (it just leaves "—" or an empty slot). */

/* Short hill names for dense rows (the data's names run long: "Revelstoke (RMR)"). */
var SHORTN={sunshine:'Sunshine',louise:'Lake Louise',norquay:'Norquay',panorama:'Panorama',kickinghorse:'Kicking Horse',revelstoke:'Revelstoke',whitewater:'Whitewater',red:'RED',schweitzer:'Schweitzer'};
function shortName(rid){ return SHORTN[rid]||((D.resorts||{})[rid]||{}).name||rid; }
/* hillOrder() — the nine hills in the order we ride them (first appearance in
   days[]), then any resort the itinerary never names. Every snow list uses it. */
function hillOrder(){ var o=[],seen={}; (D.days||[]).forEach(function(d){ if(d.rid&&!seen[d.rid]&&(D.resorts||{})[d.rid]){ seen[d.rid]=1; o.push(d.rid); } }); Object.keys(D.resorts||{}).forEach(function(k){ if(!seen[k]){ seen[k]=1; o.push(k); } }); return o; }
/* fmtIn(n) — inches for display: 0″, 2.5″, 11″ */
function fmtIn(n){ if(!(n>0.05))return '0″'; return (n<10?n.toFixed(1).replace(/\.0$/,''):String(Math.round(n)))+'″'; }

/* omDaily(rids, query) — ONE open-meteo call for several hills at once. A
   comma-separated latitude=/longitude= list comes back as a JSON array in the
   same order (one hill comes back as a plain object, so we wrap it). Resolves
   to {rid:{time:[dates], snow:[cm per day]}}. Snowfall is in cm — ÷2.54 for ″. */
function omDaily(rids,q){
  rids=rids.filter(function(k){ var r=(D.resorts||{})[k]; return r&&r.lat!=null&&r.lon!=null; });
  if(!rids.length)return Promise.resolve({});
  var lat=rids.map(function(k){ return D.resorts[k].lat; }).join(','), lon=rids.map(function(k){ return D.resorts[k].lon; }).join(',');
  return fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=snowfall_sum&'+q+'&timezone=auto').then(function(x){ return x.json(); }).then(function(j){
    var arr=Array.isArray(j)?j:[j], out={}; rids.forEach(function(k,i){ var d=(arr[i]||{}).daily; if(d&&d.time)out[k]={time:d.time,snow:d.snowfall_sum||[]}; }); return out; });
}
/* cacheGet(key, ttlMs) / cachePut(key, data) / cacheStale(key) — a tiny
   localStorage cache: {ts, data}. cacheGet returns null once it's older than
   ttl; cacheStale hands back whatever is there regardless of age (offline fallback). */
function cacheGet(key,ttl){ try{ var c=JSON.parse(localStorage.getItem(key)||'null'); if(c&&c.ts&&(Date.now()-c.ts)<ttl)return c.data; }catch(e){} return null; }
function cacheStale(key){ try{ var c=JSON.parse(localStorage.getItem(key)||'null'); return c?c.data:null; }catch(e){ return null; } }
function cachePut(key,data){ try{ localStorage.setItem(key,JSON.stringify({ts:Date.now(),data:data})); }catch(e){} }

/* ---- 1. Powder alert ----
   Shows only when a hill got POW_MIN_IN inches or more YESTERDAY — the last
   complete day open-meteo reports (past_days=2 → [day-before, yesterday, today];
   today's number is part forecast so we don't use it). One call covers all nine
   hills; the answer is cached POW_TTL ms (60 min) so ten opens in a morning
   cost one request. Several hills → one card, biggest first; on trip days the
   hill we ride today, then tomorrow, leads. Nothing over the threshold → no card.
   Screenshot hook: localStorage.powDemo='1' renders POW_FIXTURE instead of
   fetching. It never fires without that flag. Change the threshold, the cache
   time or the fixture right here. */
var POW_MIN_IN=3, POW_TTL=60*60*1000, POW_FIXTURE={revelstoke:11,kickinghorse:6,whitewater:3};
/* the jargon ladder — numbers stay honest, the words don't */
function powWord(n){ return n<1?'dust on crust':n<3?'a sprinkle — hunt cord':n<6?'soft refills all morning':n<12?'proper pow day, call in sick':'nuking — blower over-the-hood freshies'; }
function powDemoOn(){ try{ return localStorage.getItem('powDemo')==='1'; }catch(e){ return false; } }
/* powFromDaily(res) — yesterday's snowfall per hill, cm → inches: {rid: inches} */
function powFromDaily(res){ var out={}; Object.keys(res||{}).forEach(function(k){ var t=res[k].time||[], s=res[k].snow||[]; if(t.length<2)return; var v=s[t.length-2]; if(typeof v==='number')out[k]=v/2.54; }); return out; }
function powCardHtml(inches){
  var idx=tripDayIdx(), rids=hillOrder().filter(function(k){ return (inches[k]||0)>=POW_MIN_IN; });
  if(!rids.length)return '';
  var lead={}; if(idx>=0){ var t=D.days[idx]&&D.days[idx].rid, m=D.days[idx+1]&&D.days[idx+1].rid; if(t)lead[t]=2; if(m&&!lead[m])lead[m]=1; }
  rids.sort(function(a,b){ return ((lead[b]||0)-(lead[a]||0))||(inches[b]-inches[a]); });
  var top=D.resorts[rids[0]]||{}, camUrl=top.cams||top.snow||'';
  var h='<div class="card pow"><div class="powhd"><h2>'+ic('snowflake',14)+' Powder alert'+(powDemoOn()?' · demo':'')+'</h2><span class="when">yesterday</span></div>';
  rids.forEach(function(k,i){ var n=inches[k], tag=lead[k]===2?'today':lead[k]===1?'tomorrow':'';
    h+='<div class="prow'+(i===0?' lead':'')+'"><div class="pn"><div class="ph">'+esc(shortName(k))+(tag?'<span class="ptag">'+tag+'</span>':'')+'</div><div class="pj">'+esc(powWord(n))+'</div></div><div class="pin">'+fmtIn(n)+'</div></div>'; });
  h+=(camUrl?'<div class="xs" style="margin-top:9px"><a href="'+esc(camUrl)+'" target="_blank" style="font-weight:700">'+esc(shortName(rids[0]))+' cams ↗</a></div>':'')+'</div>';
  return h;
}
/* powSlot() is the placeholder rHome() prints; fillPow() fills it from the
   fixture, the cache, or the network (in that order). Empty slot = no card. */
function powSlot(){ return '<div id="powslot"></div>'; }
function fillPow(){ var el=$('powslot'); if(!el)return;
  if(powDemoOn()){ el.innerHTML=powCardHtml(POW_FIXTURE); return; }
  var c=cacheGet('powCache',POW_TTL); if(c){ el.innerHTML=powCardHtml(powFromDaily(c)); return; }
  omDaily(hillOrder(),'past_days=2&forecast_days=1').then(function(res){ cachePut('powCache',res); var e2=$('powslot'); if(e2)e2.innerHTML=powCardHtml(powFromDaily(res)); }).catch(function(){ var old=cacheStale('powCache'), e3=$('powslot'); if(old&&e3)e3.innerHTML=powCardHtml(powFromDaily(old)); });
}

/* ---- 2. Get-ready one-liner ----
   Replaces the full checklist on Home: "Get ready · 3 of 10 done · next: RCR
   card by Dec 15 ›". Tap → the Get-ready view (checklist + packing + the
   emergency-info form). CK_SHORT maps each checklist id to a label short
   enough for the "next:" slot; an unmapped id falls back to its first four
   words. "Next" = the undone item with the earliest due date (overdue ones
   say so), else the first undone item without a date. */
var CK_SHORT={tires:'tire check at pickup',drivers:'licences at the counter',canister:'empty airbag cylinder',ikon:'IKON pass',khtix:'KH ticket',aaa:'AAA? tell Tanner',wh2o:'Whitewater ticket',emgform:'emergency info',avy:'avy kit check',cell:'phone plan',cash:'cash, CAD + USD'};
function ckShort(x){ return CK_SHORT[x.id]||(x.text||'').split(/\s+/).slice(0,4).join(' '); }
function readyCard(){ var items=D.checklist||[]; if(!items.length)return ''; var dn=ckDone(), done=items.filter(function(x){ return dn[x.id]; }).length, left=items.length-done;
  var todo=items.filter(function(x){ return !dn[x.id]; }), today=nowMid();
  var dated=todo.filter(function(x){ return x.due; }).sort(function(a,b){ return a.due<b.due?-1:1; }), nx=dated[0]||todo[0], line;
  if(!left)line='All done. First chair anyway — don’t be the guy we wait for.';
  else if(nx.due){ var od=dObj(nx.due)<today; line=(od?'overdue: ':'next: ')+ckShort(nx)+' · '+(od?'was due ':'by ')+fmtShort(nx.due); }
  else line='next: '+ckShort(nx);
  return '<div class="card todo ready" onclick="sw(\'ready\')"><div class="between"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">'+ic('check',13)+' Get ready</h2><span class="pill '+(left?'warn':'ok')+'">'+done+' of '+items.length+' done</span></div><div class="rnext">'+esc(line)+'</div></div><div class="chev">›</div></div></div>';
}

/* ---- the Get-ready view (7th nav tab while readyLive()) ----
   Also reached from Home's one-liner, the crew card and a row on More. All the
   pre-trip admin in one place: checklist, packing list, emergency-info form.
   The toggles call render(CUR) so ticking a box redraws this view. Once the tab

function rReady(){

/* ---- 3. Snow so far + cams ----
   Nine rows in itinerary order: last 7 days ″, season so far ″, what's typical
   for our dates (normals: snow in the 2 weeks before our ski day + the usual
   hi/lo, °C in the data → °F here) and a cam link (resorts[rid].cams, falling
   back to .snow). ONE open-meteo call with past_days=92 (the API max), cached
   SNOW_TTL ms (6 h). "Season so far" counts from Nov 1 when Nov 1 is inside the
   92-day window, otherwise it's honestly labelled "last 92 days". Off-season
   (Jul–Oct) it skips the call altogether and shows the typical column only.
   Offline: stale cache if there is one, else "—". */
var SNOW_TTL=6*60*60*1000;
function snowOffSeason(){ var m=getNow().getMonth(); return m>=6&&m<=9; }
function snowSeasonStart(){ var n=getNow(), y=n.getMonth()>=10?n.getFullYear():n.getFullYear()-1; return y+'-11-01'; }
function snowSoFarCard(){
  var off=snowOffSeason(), rids=hillOrder();
  var h='<div class="card snow"><div class="between" style="margin-bottom:8px"><h2 style="margin:0">'+ic('snowflake',13)+' Snow so far</h2><span class="pill muted" id="sfpill">'+(off?'season opens Nov':'…')+'</span></div>';
  /* header cells are printed twice: the second set (.d2) is hidden on phones and
     lets desktop lay the table out two hills per row */
  var hd=off?['Hill','Typical','']:['Hill','7 days','Season','Typical',''];
  h+='<div class="sft'+(off?' off':'')+'">';
  [0,1].forEach(function(rep){ hd.forEach(function(t,i){ h+='<div class="hd'+(i?' n':'')+(rep?' d2':'')+'">'+t+'</div>'; }); });
  rids.forEach(function(k){ var r=D.resorts[k]||{}, nm=(D.normals||{})[k], cam=r.cams||r.snow;
    h+='<div class="hl"><span>'+esc(shortName(k))+'</span></div>';
    if(!off)h+='<div class="n" id="sf7-'+k+'">…</div><div class="n" id="sfs-'+k+'">…</div>';
    h+='<div class="ty">'+(nm?('~'+nm.snowIn+'″<small>'+cF(nm.hiC)+'° / '+cF(nm.loC)+'°F</small>'):'—')+'</div>';
    h+='<div class="cam">'+(cam?'<a href="'+esc(cam)+'" target="_blank">cam ↗</a>':'')+'</div>';
  });
  h+='</div></div>';
  return h;
}
/* snowSums(res) — per hill {d7, season} in inches, plus _label for the pill */
function snowSums(res){ var start=snowSeasonStart(), out={}, since=false;
  /* m7 (Sep 24 2026): the last entry is TODAY, which is part forecast — leave it out of both sums
     (the powder alert already did). "7 days" = the last 7 complete days. */
  Object.keys(res||{}).forEach(function(k){ var t=res[k].time||[], s=res[k].snow||[], d7=0, se=0, i, end=Math.max(0,t.length-1);
    for(i=Math.max(0,end-7);i<end;i++)d7+=(s[i]||0);
    var f=t.indexOf(start); if(f<0)f=0; else since=true;
    for(i=f;i<end;i++)se+=(s[i]||0);
    out[k]={d7:d7/2.54,season:se/2.54}; });
  out._label=since?'since Nov 1':'last 92 days'; return out; }
function fillSnowSoFar(){ if(snowOffSeason()||!$('sfpill'))return;
  var apply=function(res){ var s=snowSums(res); hillOrder().forEach(function(k){ var v=s[k], a=$('sf7-'+k), b=$('sfs-'+k); if(a)a.textContent=v?fmtIn(v.d7):'—'; if(b)b.textContent=v?fmtIn(v.season):'—'; }); var p=$('sfpill'); if(p)p.textContent=s._label; };
  var c=cacheGet('snowSoFarCache',SNOW_TTL); if(c){ apply(c); return; }
  omDaily(hillOrder(),'past_days=92&forecast_days=1').then(function(res){ cachePut('snowSoFarCache',res); apply(res); }).catch(function(){
    var old=cacheStale('snowSoFarCache'); if(old){ apply(old); return; }
    hillOrder().forEach(function(k){ ['sf7-','sfs-'].forEach(function(p){ var e=$(p+k); if(e)e.textContent='—'; }); }); var p=$('sfpill'); if(p)p.textContent='offline'; });
}

/* ---- 4. Route strip ----
   The 7 stops as a chain of chips: town, dates, nights, hotel, cost, free-cancel
   date, and the drive out to the next stop. Drives come from the days[] drive
   string on the NEXT stop's check-in day ("Banff → Panorama ~2h50 (Hwy 93…)" →
   "~2h50", plus anything after a ⚠, e.g. "· US border"). Left rail = the
   Itinerary's day-accent colour for that stop. Scrolls sideways on a phone,
   one 7-up row on desktop. On trip days tonight's stop gets a "tonight" pill and
   the strip opens scrolled to it (scrollRoute). Tap → Itinerary at that stop. */
function driveInto(stopId){ var days=D.days||[]; for(var i=0;i<days.length;i++){ if(days[i].stop===stopId&&days[i].drive)return days[i].drive; } return ''; }
function driveShort(s){ if(!s)return ''; var m=s.match(/~\s?[\d.]+(?:[–-][\d.]+)?\s?h(?:\d{2})?/), t=m?m[0].replace(/\s/g,''):'', w=s.indexOf('⚠')>=0?s.split('⚠')[1].split('(')[0].trim():''; return t+(w?' · '+w:''); }

      +'<div class="rtop"><div class="rt">'+esc(s.name)+(s.id===cur?' <span class="pill" style="font-size:11px;padding:1px 6px;vertical-align:2px">tonight</span>':'')+'</div>'

      +'<div class="rh">'+esc(s.hotel)+'</div>'
      +'<div class="rc">'+esc(s.cost||'')+'</div>'

/* goStop(id) — open the Itinerary and scroll to that stop's colour group */
function goStop(id){ sw('days'); var g=STOPACC[id]; if(g)setTimeout(function(){ jumpGroup(g); },80); }

/* ---- 5. Did you know ----

function dykPool(){ var pool=[];
  (D.stops||[]).forEach(function(s){ var g=guideFor(s.id); if(!g)return; (g.facts||[]).forEach(function(f){ pool.push({t:f,label:s.name+' guide',go:"openGuide('"+s.id+"')"}); }); });

function dykCard(){ var pool=dykPool(); if(!pool.length)return ''; var n=getNow(), doy=Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(n.getFullYear(),0,1))/864e5), f=pool[doy%pool.length];
  return '<div class="card dyk" onclick="'+f.go+'"><h2>'+ic('tip',13)+' Did you know</h2><div class="fact">'+esc(f.t)+'</div><div class="go">→ '+esc(f.label)+'</div></div>'; }

/* ---- 6. Crew card (phone; desktop keeps deskCrew, which gets the same line) ----

function gnarReady(){ return typeof gnarPlayers==='function'&&typeof gnarClaims==='function'&&typeof gnarScores==='function'&&typeof gnarFetch==='function'; }

/* setView — renders a view, then lifts its <div class="hh"> (and the countdown
   banner that follows it on Home) into a .hero band and drops everything else
   into a .wrap. On phones .hero/.heroin/.wrap are plain blocks, so the output
   is byte-for-byte the layout we already ship. */
function nextEl(n){ while(n&&n.nodeType!==1) n=n.nextSibling; return n; }
function setView(id,h){
  var el=$(id); if(!el) return; el.innerHTML=h;
  var hh=null, kids=el.children;
  for(var i=0;i<kids.length;i++){ if(kids[i].className&&/\bhh\b/.test(kids[i].className)){ hh=kids[i]; break; } }
  if(!hh) return;
  var hero=document.createElement('section'); hero.className='hero';
  var hin=document.createElement('div'); hin.className='heroin';
  hero.appendChild(hin);
  el.insertBefore(hero,hh); hin.appendChild(hh);
  var nx=nextEl(hero.nextSibling);
  if(nx&&/\bbanner\b/.test(nx.className||'')) hin.appendChild(nx);
  /* the milestones row and the stats strip follow the banner on Home — both
     ride in the hero (desktop lays them out full-width under the countdown) */
  for(var k=0;k<2;k++){ var st2=nextEl(hero.nextSibling); if(st2&&/\b(hstats|milest)\b/.test(st2.className||'')) hin.appendChild(st2); else break; }
  var st=document.createElement('div'); st.className='hstripe';
  el.insertBefore(st,hero.nextSibling);
  var wrap=document.createElement('div'); wrap.className='wrap';
  el.insertBefore(wrap,st.nextSibling);
  while(wrap.nextSibling) wrap.appendChild(wrap.nextSibling);
  /* every sec() header opens a .sect that swallows the cards after it, so each
     section gets its own grid. Views with no headers are left untouched. */
  var cur=null;
  [].slice.call(wrap.children).forEach(function(n){
    if(/\bsechd\b/.test(n.className||'')){
      cur=document.createElement('div'); cur.className='sect';
      wrap.insertBefore(cur,n.nextSibling); return; }
    if(cur) cur.appendChild(n);
  });
  /* a header whose section produced nothing (e.g. the snow card is empty in
     July) drops out rather than sitting over a blank row */
  [].slice.call(wrap.getElementsByClassName('sect')).forEach(function(g){
    if(g.children.length) return;

/* ===================== SAVING MAPS FOR OFFLINE (Snow tab) — rewritten Sep 24 2026 (M10, M13, R20) =====================

   mapV(p) — a map's address with its fingerprint from trip-data's mapsFp (written by 04-app-build/stamp_map_fingerprints.py):
   maps/red.pdf → maps/red.pdf?v=3f9a0c1e. Same fingerprint → the phone's copy; a new one → the worker downloads the new

/* mapSaveOne(p,v) — download one map and make sure the phone KEPT it. M10: a 404 or a full phone used to count as saved.
   The x-pr-save header asks the worker to answer only once the copy is stored; a stored copy comes back marked with
   x-pr-fp = the fingerprint asked for. Anything else is a failure, with a reason code. Returns {p, ok, why}. */

async function mapHeld(p,v){ try{ var r=await caches.match(new URL(p,location.href).href); if(!r)return false;

/* ---- Save 3D maps (R20) ----

   all nine) used to be kept only after someone opened that hill with signal. This saves hills ahead of time: sizes
   first (trip-data mapsSize, else a HEAD request per piece — nothing downloaded), the phone's free space
