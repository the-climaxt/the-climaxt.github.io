@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/space-grotesk-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/space-grotesk-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/space-grotesk-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/space-grotesk-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"Righteous";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/righteous-latin-400-normal.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--pr-paper:#FAF3D7;--pr-cream:#FBF6EC;--pr-card:#FFFCF2;--pr-ink:#241E2C;--pr-text-2:#5C5462;--pr-text-muted:#736A7B;
--pr-border:#EDE0B4;--pr-hairline:#F3EDD6;
--pr-pink:#FF4D9D;--pr-teal:#1FC9B7;--pr-purple:#8A4DEB;--pr-yellow:#FFC53D;--pr-orange:#FF8A3C;--pr-blue:#35B5E8;--pr-lime:#B8E332;
--pr-pink-text:#C4116B;--pr-teal-text:#0B6E66;--pr-purple-text:#5E2CA5;--pr-yellow-text:#7A5200;--pr-orange-text:#9C4A00;--pr-blue-text:#0E6285;--pr-lime-text:#4E6B00;
--pr-pink-tint:#FCEEF4;--pr-teal-tint:#E9F5F1;--pr-purple-tint:#F2EDFA;--pr-yellow-tint:#FBF3DA;--pr-orange-tint:#FCEFE4;--pr-blue-tint:#EAF4FB;--pr-lime-tint:#F2F7E2;
--pr-info-bg:#E9F5F1;--pr-info-text:#0B6E66;--pr-ok-bg:#F2F7E2;--pr-ok-text:#4E6B00;
--pr-warn-bg:#FFF3D2;--pr-warn-text:#7A5200;--pr-danger-bg:#FCEFE4;--pr-danger-text:#9C4A00;
--pr-card-snow-bg:var(--pr-blue-tint);--pr-card-snow-fg:var(--pr-blue-text);
--pr-card-todo-bg:var(--pr-pink-tint);--pr-card-todo-fg:var(--pr-pink-text);
--pr-card-money-bg:var(--pr-teal-tint);--pr-card-money-fg:var(--pr-teal-text);
--pr-card-stash-bg:var(--pr-purple-tint);--pr-card-stash-fg:var(--pr-purple-text);
--pr-card-meeting-bg:var(--pr-orange-tint);--pr-card-meeting-fg:var(--pr-orange-text);
--pr-card-terrain-bg:var(--pr-lime-tint);--pr-card-terrain-fg:var(--pr-lime-text);
--pr-card-warn-border:1.5px solid #C89B3C;
--pr-card-alert-border:1.5px solid #9C4A00;
--pr-link:var(--pr-pink-text);--pr-btn-primary-bg:var(--pr-pink-text);
--pr-nav-selected:var(--pr-pink-text);--pr-nav-idle:#A29AA8;
--pr-hero-bg:var(--pr-ink);--pr-hero-text:var(--pr-cream);
--pr-font-app:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
--pr-font-app-display:"Righteous","Arial Rounded MT Bold",system-ui,sans-serif;
}
body{font-family:var(--pr-font-app);background:var(--pr-paper);color:var(--pr-ink);overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
::-webkit-scrollbar{display:none}
a{color:var(--pr-link);text-decoration:none}
svg.pri{vertical-align:-0.18em;flex:0 0 auto}
.view{display:none;padding:0 16px 96px}.view.active{display:block}
.hh{padding:22px 4px 12px}
.hh h1{font-family:var(--pr-font-app-display);font-size:23px;font-weight:400;letter-spacing:.5px}
.hh h1::after{content:"";display:block;width:54px;height:5px;border-radius:3px;background:var(--pr-teal);margin-top:7px}
.hh .sub{font-size:13px;color:var(--pr-text-muted);margin-top:6px}
.card{background:var(--pr-card);border:1px solid var(--pr-border);border-radius:14px;padding:15px;margin-bottom:12px}
.card h2{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--pr-text-muted);margin-bottom:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--pr-pink-tint);color:var(--pr-pink-text)}
.pill.warn{background:var(--pr-warn-bg);color:var(--pr-warn-text)}.pill.ok{background:var(--pr-ok-bg);color:var(--pr-ok-text)}.pill.muted{background:#F1EBE0;color:var(--pr-text-2)}
.big{font-family:var(--pr-font-app-display);font-size:46px;font-weight:400;letter-spacing:1px;line-height:1;text-shadow:3px 3px 0 var(--pr-pink)}
.muted{color:var(--pr-text-muted)}.sm{font-size:13px}.xs{font-size:11.5px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 13px;border-radius:10px;border:1px solid var(--pr-border);background:var(--pr-card);color:var(--pr-ink);cursor:pointer}
.btn.pri{background:var(--pr-btn-primary-bg);color:#fff;border-color:var(--pr-btn-primary-bg)}
.lk{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--pr-border);border-radius:11px;margin-bottom:8px;background:var(--pr-card);font-size:14px;font-weight:600}
.lk small{display:block;font-weight:400;color:var(--pr-text-muted);font-size:11.5px;margin-top:1px}
.day{border-left:3px solid #E3D9C8;padding:2px 0 2px 12px;margin-bottom:14px}
.day.today{border-color:var(--pr-pink)}
.day .dt{font-size:11px;font-weight:700;color:var(--pr-text-muted);text-transform:uppercase;letter-spacing:.5px}
.day.today .dt{color:var(--pr-pink-text)}
.day .ti{font-size:15px;font-weight:700;margin-top:1px}
.tl{font-size:13px;color:var(--pr-text-2);margin-top:3px}
.inp{width:100%;border:1px solid var(--pr-border);border-radius:10px;padding:11px;font-size:15px;font-family:inherit;background:var(--pr-card);color:var(--pr-ink)}
.banner{background:var(--pr-hero-bg);color:var(--pr-hero-text);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.hero-ti{font-family:var(--pr-font-app-display);font-size:22px;font-weight:400;letter-spacing:.5px;text-shadow:2px 2px 0 var(--pr-pink)}
.card.snow{background:var(--pr-card-snow-bg)}.card.snow h2{color:var(--pr-card-snow-fg)}
.card.todo{background:var(--pr-card-todo-bg)}.card.todo h2{color:var(--pr-card-todo-fg)}
.card.money{background:var(--pr-card-money-bg)}.card.money h2{color:var(--pr-card-money-fg)}
.card.stash{background:var(--pr-card-stash-bg)}.card.stash h2{color:var(--pr-card-stash-fg)}
.card.meeting{background:var(--pr-card-meeting-bg)}.card.meeting h2{color:var(--pr-card-meeting-fg)}
.card.terrain{background:var(--pr-card-terrain-bg)}.card.terrain h2{color:var(--pr-card-terrain-fg)}
.card.snow,.card.todo,.card.money,.card.stash,.card.meeting,.card.terrain{border-color:rgba(0,0,0,.07)}
.card.snow .muted,.card.todo .muted,.card.money .muted,.card.stash .muted,.card.meeting .muted,.card.terrain .muted,.card.tint .muted{color:var(--pr-text-2)}.card.tint{background:var(--t-bg);border-color:rgba(0,0,0,.07)}.card.tint h2{color:var(--t-fg)}
.card.alertcard{background:var(--pr-danger-bg);border:var(--pr-card-alert-border)}
.stripe{height:5px;border-radius:3px;margin-top:12px;background:linear-gradient(90deg,var(--pr-pink) 0 25%,var(--pr-yellow) 25% 50%,var(--pr-teal) 50% 75%,var(--pr-purple) 75% 100%)}
.tbann{background:var(--pr-warn-bg);border:1px solid #EFD9A0;color:var(--pr-warn-text);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.soon{text-align:center;color:var(--pr-text-muted);padding:38px 16px}
.soon .ic{font-size:30px}.soon .t{font-weight:700;color:var(--pr-text-2);margin-top:8px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--pr-card);border-top:1px solid var(--pr-border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 7px;border:none;background:none;cursor:pointer;color:var(--pr-nav-idle)}
.nb .ic{height:19px;line-height:1;display:flex;align-items:center}.nb span{font-size:9.5px;margin-top:3px;font-weight:600}
.nb.on{color:var(--pr-nav-selected)}.nb.on span{font-weight:700}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--pr-ink);color:#fff;font-size:13px;padding:9px 15px;border-radius:10px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* ===================== ZONE MAP OVERLAY =====================
   Opens from Snow -> Terrain (a zone header, or any run row). Full-screen,
   sits above the nav; the Snow tab underneath is untouched. Map fills the
   stage, runs + keymap live in a drawer that collapses to give the map the
   whole screen. Solid ink chrome, no scrims, no blur (chairlift glare rule). */
#zov{position:fixed;inset:0;z-index:300;background:var(--pr-ink);display:none;--zdh:52%}
#zov.on{display:block}
#zstage{position:absolute;left:0;right:0;top:0;bottom:var(--zdh);transition:bottom .28s ease;overflow:hidden;touch-action:none}
#zpan{position:absolute;inset:0;transform-origin:0 0}
#zzoom{position:absolute;left:12px;z-index:5;display:none;align-items:center;gap:7px;
 background:var(--pr-ink);color:var(--pr-cream);border:1px solid var(--pr-text-2);
 border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
#zzoom.on{display:inline-flex}
#zzoom:active{opacity:.8}
/* mouse-driven devices can't pinch — give them buttons (and the wheel) */
#zbtns{position:absolute;right:12px;z-index:5;display:none;flex-direction:column;gap:6px}
#zbtns.on{display:none}
#zbtns button{width:36px;height:36px;border-radius:999px;background:var(--pr-cream);color:var(--pr-ink);
 border:0;font-size:17px;font-family:inherit;font-weight:600;cursor:pointer;
 display:flex;align-items:center;justify-content:center;padding:0}
#zbtns button:hover{background:#fff}
#zbtns button:active{opacity:.7}
#zbtns button:disabled{opacity:.4;cursor:default}
@media (hover:hover) and (pointer:fine){ #zbtns.on{display:flex} }
#zstage img{width:100%;height:100%;object-fit:contain;display:block}
.zpulse{position:absolute;width:0;height:0;pointer-events:none;transition:left .28s ease,top .28s ease}
.zpulse i{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:3px solid var(--pr-yellow);opacity:0}
.zpulse b{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--pr-yellow);border:2px solid var(--pr-ink);opacity:0}
.zpulse.go i{animation:zring 1.15s ease-out 2}
.zpulse.go i:nth-child(2){animation-delay:.3s}
.zpulse.go b{animation:zdot 2.4s ease-out 1}
@keyframes scpulse{0%{opacity:.95;r:8px}100%{opacity:0;r:26px}}.pring.pulsing{animation:scpulse 1.1s ease-out 2}@keyframes scyou{0%{r:8px;opacity:.9}70%{r:22px;opacity:0}100%{r:22px;opacity:0}}.youring{animation:scyou 1.8s ease-out infinite}
@keyframes zring{0%{transform:scale(.4);opacity:0}20%{opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes zdot{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}
/* Access + egress routes are LINES, not points, so their pulse is an SVG
   polyline laid over the crop in the same letterboxed rect the pins use.
   Strokes carry vector-effect:non-scaling-stroke — a pinch magnifies the map
   but never the line. The counter-scale trick .zpulse uses can't do that. */
#zsvg{position:absolute;pointer-events:none;overflow:visible;z-index:3}
#zsvg path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#zsvg .halo{stroke:var(--pr-ink);stroke-width:8;opacity:.30}
#zsvg .core{stroke:var(--pr-pink);stroke-width:3.5}
#zsvg g.go .core{stroke-dasharray:11 8;animation:zdash 1.05s linear infinite}
#zsvg g.go .halo{animation:zhalo 1.2s ease-out 3}
/* endpoint dot carries the KIND: hollow = way in, filled = way out.
   (dashes are taken — they mean "this route is selected".) */
#zsvg circle{fill:var(--pr-card);stroke:var(--pr-ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
#zsvg g.out circle{fill:var(--pr-pink)}
@keyframes zdash{to{stroke-dashoffset:-38}}
@keyframes zhalo{0%{opacity:.55}100%{opacity:.16}}
.zrr.rtrow .zd{border-radius:2px;width:14px;height:5px;background:var(--pr-card);border:1px solid var(--pr-ink)}
.zrr.rtrow.out .zd{background:var(--pr-pink)}
#ztop{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;gap:8px;align-items:center;
 padding:9px 12px;padding-top:calc(9px + env(safe-area-inset-top));
 background:var(--pr-ink);border-bottom:3px solid var(--pr-teal)}
#ztop .zx{flex:0 0 auto;width:32px;height:32px;border-radius:999px;background:var(--pr-cream);color:var(--pr-ink);
 border:0;font-size:14px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}
#ztop .zx:active{opacity:.7}
#zchips{display:flex;gap:6px;overflow-x:auto;flex:1}
#zchips button{white-space:nowrap;font-family:inherit;font-size:12.5px;font-weight:600;border:0;border-radius:999px;
 padding:7px 12px;background:var(--pr-cream);color:var(--pr-text-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
#zchips button.on{background:var(--pr-btn-primary-bg);color:#fff}
#zchips button:active{opacity:.8}
#zreflash{position:absolute;left:50%;margin-left:-40vw;width:80vw;justify-content:center;z-index:5;display:none;
 align-items:center;gap:9px;background:var(--pr-ink);color:var(--pr-cream);border:1px solid var(--pr-text-2);
 border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
#zreflash.on{display:flex}
#zreflash:active{opacity:.8}
#zreflash .zrd{width:10px;height:10px;border-radius:50%;background:var(--pr-yellow);flex:0 0 auto}
#zreflash .zrn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zdrawer{position:absolute;left:0;right:0;bottom:0;height:var(--zdh);z-index:6;background:var(--pr-card);
 border-top:1px solid var(--pr-border);border-radius:14px 14px 0 0;transition:height .28s ease;
 overflow:hidden;display:flex;flex-direction:column}
#zdrawer .zgrab{position:absolute;top:3px;left:50%;margin-left:-10px;width:20px;height:15px;
 line-height:15px;text-align:center;font-size:12px;color:var(--pr-text-muted);
 z-index:2;pointer-events:none;transition:transform .28s}
#zdrawer.shut .zgrab{transform:rotate(180deg)}
#zbar{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:17px 16px 10px;cursor:pointer}
#zbar .zdt{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zbar .zdg{font-size:11.5px;font-weight:700;background:var(--pr-danger-bg);color:var(--pr-danger-text);
 padding:2px 8px;border-radius:999px;display:none;align-items:center;gap:4px}
#zbar .zdg.on{display:inline-flex}
#zbody{flex:1;overflow-y:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom));opacity:1;transition:opacity .16s}
#zdrawer.shut #zbody{opacity:0;pointer-events:none;overflow:hidden}
.zrow{display:flex;gap:12px;padding:0 16px;align-items:flex-start}
.zrow .znote{flex:1;min-width:0}
.zrow .znote .zsub{font-size:11.5px;color:var(--pr-text-2);line-height:1.5}
.zrow .zkey{flex:0 0 44%;border:1px solid var(--pr-border);border-radius:11px;overflow:hidden;line-height:0}
.zrow .zkey img{width:100%;display:block}
.zgroup{padding:14px 16px 2px}
.zgroup label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--pr-text-2)}
.zgroup input{width:18px;height:18px;accent-color:var(--pr-btn-primary-bg);cursor:pointer;margin:0;flex:0 0 auto}
.zruns{padding:2px 16px 0}
.zruns .zlab{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--pr-text-2);
 margin:13px 0 7px;display:flex;align-items:center;gap:7px}
.zruns .zlab .zct{background:var(--pr-yellow-tint);color:var(--pr-yellow-text);border-radius:999px;
 padding:2px 8px;font-size:11.5px;letter-spacing:0}
.zrr{display:flex;align-items:center;gap:10px;border:1px solid var(--pr-border);background:var(--pr-card);
 border-radius:11px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
.zrr:active{opacity:.7}
.zrr.on{border:1.5px solid var(--pr-btn-primary-bg)}
.zrr .zd{width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--pr-text-2);border:1px solid var(--pr-ink)}
.zrr .znm{font-size:13px;font-weight:600;flex:1}
.zrr .zzt{font-size:11.5px;font-weight:600;color:var(--pr-text-muted)}
.lv-expert .zd,.lv-adv .zd{background:var(--pr-ink)}
.lv-extreme .zd{background:var(--pr-orange)}
.lv-int .zd{background:var(--pr-blue)}
.lv-beginner .zd{background:var(--pr-lime)}
.zrr .zsb{font-size:11px;font-weight:400;color:var(--pr-text-2);margin-top:2px;line-height:1.45}
.kind{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;flex:0 0 auto}
.kind.cruiser{background:var(--pr-lime-tint);color:var(--pr-lime-text)}
.kind.stop{background:var(--pr-teal-tint);color:var(--pr-teal-text)}
.kind.view{background:var(--pr-teal-tint);color:var(--pr-teal-text)}
.k-cruiser .zd{background:var(--pr-lime)}
.k-stop .zd{background:var(--pr-teal)}
.k-view .zd{background:var(--pr-teal)}
/* ---- picks UI (v.69.10) ---------------------------------------------
   The drawer is now three blocks: the ranked picks, the cruiser itinerary,
   and everything else behind a disclosure. Unpinned runs render too — they
   just get a dashed dot and don't try to flash. */
.zrr.pk{border-color:var(--pr-yellow);background:var(--pr-yellow-tint);align-items:flex-start}
.zrr.pk.on{border:1.5px solid var(--pr-btn-primary-bg)}
.zrk{flex:0 0 auto;min-width:21px;height:21px;border-radius:999px;background:var(--pr-ink);
 color:var(--pr-cream);font-size:11px;font-weight:700;display:flex;align-items:center;
 justify-content:center;padding:0 5px;margin-top:1px}
.znum{flex:0 0 auto;min-width:23px;height:19px;border-radius:5px;border:1px solid var(--pr-ink);
 background:var(--pr-card);color:var(--pr-ink);font-size:10.5px;font-weight:700;
 display:flex;align-items:center;justify-content:center;padding:0 4px;margin-top:1px}
.zchip{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
 border-radius:999px;padding:2px 7px;flex:0 0 auto}
.zchip.cat{background:var(--pr-lime-tint);color:var(--pr-lime-text)}
.zchip.gated{background:var(--pr-warn-bg);color:var(--pr-warn-text)}
.zchip.air{background:var(--pr-danger-bg);color:var(--pr-danger-text)}
.zchip.hike{background:var(--pr-purple-tint);color:var(--pr-purple-text)}
.zchip.obsc{background:var(--pr-teal-tint);color:var(--pr-teal-text)}
.zchip.flat{background:#F1EBE0;color:var(--pr-text-2)}
.zmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.zrr .zwhy{font-size:11.5px;color:var(--pr-ink);margin-top:4px;line-height:1.45;font-weight:400}
.zrr .zent{font-size:11px;color:var(--pr-text-2);margin-top:5px;line-height:1.45;font-weight:400;
 border-left:2px solid var(--pr-border);padding-left:8px}
.zrr .zent.warn{border-left-color:var(--pr-orange);color:var(--pr-danger-text)}
.zrr .zsto{font-size:11px;color:var(--pr-purple-text);margin-top:5px;line-height:1.45;font-weight:400}
.zrr.nopin{cursor:default}

async function gateTry(name,pw){ if(!(window.crypto&&crypto.subtle))throw new Error('no-sc'); var g=EMB.gate;
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(normName(name)+'|'+pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(g.salt),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt','encrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(g.iv)},key,b64d(g.ct));
  D=JSON.parse(new TextDecoder().decode(pt)); GATEKEY=key; await initDataKey(); return true; }

/* ---- data key: crew-submitted stuff, decoupled from the gate password ----
   Emergency records and shared files USED to be encrypted with the key derived
   from the gate password, which meant changing that password silently orphaned
   every one of them. They are now encrypted with a random key that lives INSIDE
   the encrypted trip data, so the gate password can be rotated freely.
   LEGACYKEY keeps anything submitted before this change readable, so nothing is
   lost on the way over. */
async function initDataKey(){
  LEGACYKEY=GATEKEY; DATAKEY=null;
  var raw=D&&D.dataKey;
  if(raw){ try{ DATAKEY=await crypto.subtle.importKey('raw',b64d(raw),{name:'AES-GCM'},false,['encrypt','decrypt']); }catch(e){ DATAKEY=null; } }
  if(!DATAKEY) DATAKEY=GATEKEY;   /* older data file with no dataKey: behave exactly as before */
}
async function dkDecrypt(ivb,datab){
  try{ return await crypto.subtle.decrypt({name:'AES-GCM',iv:ivb},DATAKEY,datab); }
  catch(e){ if(LEGACYKEY&&LEGACYKEY!==DATAKEY) return await crypto.subtle.decrypt({name:'AES-GCM',iv:ivb},LEGACYKEY,datab); throw e; }
}

async function adminReEncrypt(){ var nm=($('adName')||{}).value||'', pw=($('adPw')||{}).value||'';
  if(!nm||!pw){ toast('New trip name + password required'); return; }
  var salt=new Uint8Array(16), iv=new Uint8Array(12); crypto.getRandomValues(salt); crypto.getRandomValues(iv);
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(normName(nm)+'|'+pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(D)));
  var wrapper={gate:{salt:b64e(salt.buffer),iv:b64e(iv.buffer),ct:b64e(ct)},open:(EMB&&EMB.open)||{title:(D.meta||{}).title||'Trip',year:(D.meta||{}).year||''}};
  var b=new Blob([JSON.stringify(wrapper)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='trip-data.json'; a.click();
  toast('Downloaded — upload to GitHub, then share the new phrase'); }

function emgUrl(){ return D.docsUrl||D.runsUrl||''; }
async function applyEmg(arr){ var ch=false;
  for(var i=0;i<arr.length;i++){ var sb=arr[i]; if(!sb||!sb.who||!sb.data||!sb.iv)continue;
    try{ var pt=await dkDecrypt(b64d(sb.iv),b64d(sb.data)); var em=JSON.parse(new TextDecoder().decode(pt));
      (D.crew||[]).forEach(function(c){ if(normName(c.name)===normName(sb.who)){ em.submitted=sb.ts||em.submitted; c.emergency=em; ch=true; } });
    }catch(e){}
  } return ch; }
function loadEmg(){ try{ var c=JSON.parse(localStorage.getItem('emgCache')||'null'); if(c&&c.length)applyEmg(c).then(function(ch){ if(ch&&CUR==='more')render(CUR); }); }catch(e){}
  var u=emgUrl(); if(!u)return;
  fetch(u+'?emg=1').then(function(x){return x.json();}).then(function(a){ if(!Array.isArray(a))return; a=a.filter(function(sb){return sb&&sb.who&&sb.data&&sb.iv;}); if(!a.length)return; localStorage.setItem('emgCache',JSON.stringify(a)); applyEmg(a).then(function(ch){ if(ch&&(CUR==='more'||CUR==='home'))render(CUR); }); }).catch(function(){}); }
async function submitEmg(){
  var who=($('emWho')||{}).value||''; if(!who){ toast('Pick your name first'); return; }
  function v(id){ return (($(id)||{}).value||'').trim(); }
  var covs=[];
  if(v('emRco')){ covs.push({name:v('emRco'),phone:v('emRph'),policy:v('emRid'),callFirst:!!(($('emRcf')||{}).checked),note:(($('emRcf')||{}).checked?'They must be called BEFORE any rescue/evac is arranged — no call = not covered.':'Pay out of pocket, keep every receipt, claim after.')}); }
  if(v('emHco')||v('emHid')){ covs.push({name:'Health insurance — '+(v('emHco')||'plan'),phone:v('emHph'),policy:(v('emHid')?'Member ID '+v('emHid'):''),callFirst:!!(($('emHcf')||{}).checked),note:(($('emHcf')||{}).checked?'Call them before non-life-threatening treatment or any transport decisions.':'Pay out of pocket, keep every receipt, claim after.')}); }
  var med={allergies:v('emAll'),meds:v('emMed'),blood:v('emBld'),notes:v('emNts')};
  var em={ice:{name:v('emIn'),phone:v('emIp')},coverages:covs,submitted:Date.now()};
  if(med.allergies||med.meds||med.blood||med.notes)em.medical=med;
  localStorage.setItem('me',who);
  try{ var iv=sdocIv(); var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},DATAKEY,new TextEncoder().encode(JSON.stringify(em)));
    var sub={who:who,iv:b64e(iv.buffer),data:b64e(ct),ts:Date.now()};
    var cache=[]; try{ cache=JSON.parse(localStorage.getItem('emgCache')||'[]')||[]; }catch(e){}
    cache=cache.filter(function(sb){return normName(sb.who)!==normName(who);}); cache.push(sub);
    localStorage.setItem('emgCache',JSON.stringify(cache));
    (D.crew||[]).forEach(function(c){ if(normName(c.name)===normName(who))c.emergency=em; });
    var u=emgUrl();
    if(u){ fetch(u,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'putemg',who:who,iv:sub.iv,data:sub.data})}).then(function(){ toast('Saved — hits everyone’s phone on their next open'); }).catch(function(){ toast('Saved on this phone — needs wifi to reach the crew'); }); }
    else toast('Saved on this phone — sharing pipe not switched on yet');
    render('more');
  }catch(e){ toast('Couldn’t encrypt — tell Tanner'); }
}

function ic(n,s){s=s||14;var g=IC[n];if(!g)return '';return '<svg class="pri" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="currentColor" aria-hidden="true">'+g+'</svg>';}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1900);}

/* ===================== ZONE MAP OVERLAY =====================
   Pre-cut zone crops (spotlight dim baked in at build time) + a pre-baked
   keymap per sheet. No pan/zoom engine, no fly-to: tap a run, the crop for
   its zone comes up and a ring pulses where the run is. The pulse is
   deliberately forgiving, so pins only have to be roughly right.
   Data lives on each terrain zone as z.zmap {img,key,asp,sheet,gated,entry,note}
   and on each run as r.x / r.y / r.lift (+ r.approx when the sheet doesn't
   name the line). A zone with no zmap simply renders as it always has. */
var ZR=null, ZI=0, ZRUN=-1, ZSHUT=false, ZBYLIFT=false, ZBYBOWL=false, ZPULSE=null, ZOPEN=false, ZPUSHED=false;

/* "Cruisers only" is ONE state per resort (TMODE[rid]), shared by the Snow-tab
   checkbox and the drawer checkbox — tick either and both follow. For runs,
   level is the only trustworthy signal: r.type is free text with 130+ distinct
   values. POIs carry an explicit kind and are mellow by definition. */
function isMellowRun(r){ return r.cruiser===true||r.kind==='cruiser'||r.kind==='stop'||r.kind==='view'
  ||r.level==='int'||r.level==='beginner'; }
function cruisersOn(k){ return TMODE[k]==='mellow'; }
function zKeep(r){ return !cruisersOn(ZR)||isMellowRun(r); }

/* Map POIs (lodges, viewpoints, the curated cruisers that aren't zone runs) stay
   in their own arrays — cabins/woods/cruisers — and get pinned by adding
   zone + x + y + kind + lift to the entry. No content is duplicated. A zone's
   item list is its runs followed by its POIs; that index is what zOpen() takes. */
function zPois(t,zname){ var out=[];
  ['cruisers','cabins','woods'].forEach(function(src){ ((t||{})[src]||[]).forEach(function(p){
    if(p.zone===zname&&p.x!=null&&p.y!=null)out.push(p); }); });
  return out; }
function zItems(t,z){ return (z.runs||[]).concat(zPois(t,z.name)); }
function zList(){ var z=zZone(); return z?zItems((D.terrain||{})[ZR],z):[]; }
function setCruisers(k,on){
  if(!k)return; TMODE[k]=on?'mellow':'all';
  var el=$('terr-'+k); if(el&&el.style.display!=='none')el.innerHTML=terrainHtml((D.terrain||{})[k],TMODE[k],k);
  if(ZOPEN&&ZR===k){
    var cb=$('zcruise'); if(cb)cb.checked=on;
    var it=zList()[ZRUN];
    if(ZRUN>=0&&it&&!zKeep(it)){ ZRUN=-1; zClearPulse(); }
    zChips(); zRenderRuns();
  }
}
function zHasMap(z){ return !!(z&&z.zmap&&z.zmap.img); }
function zMapZones(k){ var t=(D.terrain||{})[k]||{}; return (t.zones||[]).filter(zHasMap); }
function zZone(){ return zMapZones(ZR)[ZI]; }

function zOpen(k,zi,ri){
  if(!D||!D.terrain||!D.terrain[k])return;
  ZR=k; ZSHUT=false; ZOPEN=true;
  $('zov').classList.add('on'); $('zov').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  if(!ZPUSHED){ try{ history.pushState({zov:1},''); ZPUSHED=true; }catch(e){} }
  var cb=$('zcruise'); if(cb)cb.checked=cruisersOn(k);
  /* "Group by bowl" only makes sense where the zones ARE bowls — Kicking Horse.
     Everywhere else the row hides and the state resets. */
  var br=$('zbybowlrow'); if(br)br.style.display=(k==='kickinghorse')?'':'none';
  if(k!=='kickinghorse'){ ZBYBOWL=false; var bb=$('zbybowl'); if(bb)bb.checked=false; }
  zBindZoom(); zResetZoom();
  zChips(); zSetZone(zi);
  requestAnimationFrame(function(){
    zSizeDrawer();
    if(ri>=0){ setTimeout(function(){ zFlash(ri); },330); }
    else { var z=zZone(); if(z&&z.zmap.entry) setTimeout(function(){ zFlashAt(z.zmap.entry[0],z.zmap.entry[1]); },330); }
  });
}
function zClose(fromPop){
  ZOPEN=false; ZRUN=-1; zClearPulse(); zResetZoom();
  $('zov').classList.remove('on'); $('zov').setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  if(fromPop!==true && ZPUSHED){ ZPUSHED=false; try{ history.back(); }catch(e){} }
}
window.addEventListener('popstate',function(){ if(ZOPEN){ ZPUSHED=false; zClose(true); } });

function zChips(){
  var box=$('zchips'); box.innerHTML='';
  zMapZones(ZR).forEach(function(z,i){
    var b=document.createElement('button');
    b.innerHTML=(z.zmap.gated?ic('warning',12):'')+esc(z.name.replace(/\s*\((gated|mellow)\)\s*$/,''));
    if(i===ZI)b.className='on';
    else if(cruisersOn(ZR)&&!zItems((D.terrain||{})[ZR],z).some(isMellowRun))b.className='dim';
    b.onclick=function(){ zSetZone(i); ZRUN=-1; zClearPulse(); zRenderRuns(); };
    box.appendChild(b);
  });
}
function zSetZone(i){
  ZI=i; zResetZoom(); var z=zZone(); if(!z)return; var r=(D.resorts||{})[ZR]||{};
  $('zimg').src=z.zmap.img; $('zimg').alt=z.name+' zone map';
  $('zkeyimg').src=z.zmap.key; $('zkeyimg').alt='Where '+z.name+' sits on the sheet';
  $('zdtitle').textContent=z.name;
  $('zdgate').innerHTML=ic('warning',12)+' Gated';
  $('zdgate').className='zdg'+(z.zmap.gated?' on':'');
  var bits=[];
  if(z.access)bits.push(esc(z.access));
  if(z.aspect)bits.push(esc(z.aspect));
  if(z.timing)bits.push(esc(z.timing));
  var sub=bits.join(' \u00b7 ');
  if(z.closure)sub+='<div style="margin-top:4px;color:var(--pr-warn-text);font-weight:700">'+ic('closed',12)+' '+esc(z.closure)+'</div>';
  if(z.zmap.note)sub+='<div style="margin-top:4px">'+ic('tip',12)+' '+esc(z.zmap.note)+'</div>';
  $('zsub').innerHTML=sub;
  var sk=z.zmap.sheet||'map', href=r[sk], lab=r[sk+'Label'];
  $('zopen').innerHTML=href?('<a class="btn" href="'+href+'" download>'+ic('map',14)+' Open the full '+esc(lab||'trail')+' map</a>'):'';
  var box=$('zchips'), kids=box.children, zs=zMapZones(ZR);
  for(var j=0;j<kids.length;j++)kids[j].className=(j===i?'on':
    ((cruisersOn(ZR)&&!zItems((D.terrain||{})[ZR],zs[j]).some(isMellowRun))?'dim':''));
  /* keep the active chip visible — zones 4 and 5 sit off the right edge */
  if(kids[i])box.scrollLeft=Math.max(0,kids[i].offsetLeft-(box.clientWidth-kids[i].offsetWidth)/2);
  ZRT=-1; zDrawRoutes(); zRenderRuns();
}
/* ================= the drawer list =================
   Three blocks: the ranked picks, the cruiser itinerary, then everything
   else behind a disclosure. `ri` is always the index into zItems() — that
   is what zFlash takes — so it is carried, never recomputed from a
   filtered array. Runs with no pin still render; they just cannot flash. */
var ZSORT=[], ZSPICY=false, ZALL=false;
var ZSORTKEYS=[['num','#'],['lift','Lift'],['level','Level'],['cat','Type'],
               ['vert','Vertical'],['name','A-Z']];

function zHasNums(k){ var t=(D.terrain||{})[k]||{};
  return (t.zones||[]).some(function(z){ return (z.runs||[]).some(function(r){ return r.num; }); }); }
function zIsPick(r){ return typeof r.pick==='number'; }
function zSpicyOK(r){ return !ZSPICY||(r.air||0)>=2; }

function zSortToggle(k){ var i=ZSORT.indexOf(k);
  if(i<0)ZSORT.push(k); else ZSORT.splice(i,1);
  zRenderRuns(); }

function zSortVal(r,k){
  if(k==='num'){ var m=String(r.num||'').match(/^(\d+)(.*)$/);
    return m?[parseInt(m[1],10),m[2]||'']:[9e9,String(r.num||'')]; }
  if(k==='lift')  return [0,(r.lifts&&r.lifts[0])||r.lift||'￿'];
  if(k==='level') return [({beginner:0,int:1,adv:2,expert:3,extreme:4})[r.level]!=null
                          ?({beginner:0,int:1,adv:2,expert:3,extreme:4})[r.level]:9,''];
  if(k==='cat')   return [0,r.cat||'￿'];
  if(k==='vert')  return [-(((r.meas||{}).vert)||0),''];
  return [0,(r.name||'').toLowerCase()];
}
/* Stackable: every active key is applied in the order it was tapped, so
   "Lift" then "#" really does sort by lift AND number, not one or other. */
function zCmp(a,b){
  for(var i=0;i<ZSORT.length;i++){
    var x=zSortVal(a,ZSORT[i]), y=zSortVal(b,ZSORT[i]);
    if(x[0]!==y[0])return x[0]<y[0]?-1:1;
    if(x[1]!==y[1])return x[1]<y[1]?-1:1;
  }
  return 0;
}

function toggleCheck(id){ var d=ckDone(); d[id]=!d[id]; localStorage.setItem('ckDone',JSON.stringify(d)); render('home'); }

/* setView — renders a view, then lifts its <div class="hh"> (and the countdown
   banner that follows it on Home) into a .hero band and drops everything else
   into a .wrap. On phones .hero/.heroin/.wrap are plain blocks, so the output
   is byte-for-byte the layout we already ship. */
function nextEl(n){ while(n&&n.nodeType!==1) n=n.nextSibling; return n; }
function setView(id,h){
  var el=$(id); if(!el) return; el.innerHTML=h;
  var hh=null, kids=el.children;
  for(var i=0;i<kids.length;i++){ if(kids[i].className&&/\bhh\b/.test(kids[i].className)){ hh=kids[i]; break; } }
  if(!hh) return;
  var hero=document.createElement('section'); hero.className='hero';
  var hin=document.createElement('div'); hin.className='heroin';
  hero.appendChild(hin);
  el.insertBefore(hero,hh); hin.appendChild(hh);
  var nx=nextEl(hero.nextSibling);
  if(nx&&/\bbanner\b/.test(nx.className||'')) hin.appendChild(nx);
  var st2=nextEl(hero.nextSibling);
  if(st2&&/\bhstats\b/.test(st2.className||'')) hin.appendChild(st2);
  var st=document.createElement('div'); st.className='hstripe';
  el.insertBefore(st,hero.nextSibling);
  var wrap=document.createElement('div'); wrap.className='wrap';
  el.insertBefore(wrap,st.nextSibling);
  while(wrap.nextSibling) wrap.appendChild(wrap.nextSibling);
  /* every sec() header opens a .sect that swallows the cards after it, so each
     section gets its own grid. Views with no headers are left untouched. */
  var cur=null;
  [].slice.call(wrap.children).forEach(function(n){
    if(/\bsechd\b/.test(n.className||'')){
      cur=document.createElement('div'); cur.className='sect';
      wrap.insertBefore(cur,n.nextSibling); return; }
    if(cur) cur.appendChild(n);
  });
  /* a header whose section produced nothing (e.g. the snow card is empty in
     July) drops out rather than sitting over a blank row */
  [].slice.call(wrap.getElementsByClassName('sect')).forEach(function(g){
    if(g.children.length) return;
    var p=g.previousSibling; while(p&&p.nodeType!==1) p=p.previousSibling;
    if(p&&/\bsechd\b/.test(p.className||'')) p.parentNode.removeChild(p);
    g.parentNode.removeChild(g);
  });
}

function rDays(){
  var idx=tripDayIdx(), h=testBanner()+'<div class="hh"><h1>Itinerary</h1><div class="sub">'+fmtShort(D.meta.start)+' – '+fmtShort(D.meta.end)+' · '+D.days.length+' days · color = where we\u2019re riding</div></div>';
  var seenAcc=[]; D.days.forEach(function(d){ var g=d.rid?GROUPACC[d.rid]:STOPACC[d.stop]; if(g&&seenAcc.indexOf(g)<0)seenAcc.push(g); });
  if(seenAcc.length){ h+='<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">'; seenAcc.forEach(function(g){ h+='<button onclick="jumpGroup(\''+g+'\')" style="display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;font-family:inherit;color:var(--pr-text-2);background:var(--pr-card);border:1px solid var(--pr-border);border-radius:999px;padding:3px 9px 3px 6px;cursor:pointer"><span style="width:9px;height:9px;border-radius:99px;background:'+ACCENTS[g][0]+'"></span>'+ACCLABEL[g]+'</button>'; }); h+='</div>'; }
  var seenFirst={};
  D.days.forEach(function(day,i){ var r=resortOfDay(day), st=stopById(day.stop), today=(i===idx), checkin=(st&&st.in===day.dt);
    var acc=dayAccent(day), g=day.rid?GROUPACC[day.rid]:STOPACC[day.stop], anchor=(g&&!seenFirst[g])?' id="dayg-'+g+'"':''; if(g)seenFirst[g]=true;
    var isPast=(idx>=0&&i<idx&&!PAST_OPEN[i]);
    if(isPast){ h+='<div class="day"'+anchor+' style="opacity:.5;cursor:pointer;padding-top:9px;padding-bottom:9px'+(acc?';border-left:3px solid '+acc[0]:'')+'" onclick="PAST_OPEN['+i+']=1;rDays()"><div class="dt">'+day.wd+' · '+fmtShort(day.dt)+' · done ✓</div><div class="ti" style="font-size:15px">'+esc(day.title)+'</div></div>'; return; }
    h+='<div class="day'+(today?' today':'')+'"'+(today?' id="day-today"':anchor)+(acc?' style="border-left:'+(today?'4px':'3px')+' solid '+acc[0]+'"':'')+'><div class="dt"'+(today&&acc?' style="color:'+acc[1]+'"':'')+'>'+day.wd+' · '+fmtShort(day.dt)+(today?' · TODAY':'')+'</div><div class="ti">'+esc(day.title)+'</div>';
    var b=[]; if(r)b.push(ic('skier',14)+' '+esc(r.name)); if(st&&!checkin)b.push(ic('bed',14)+' '+esc(st.hotel)); if(day.drive)b.push(ic('car',14)+' '+esc(day.drive)); if(b.length)h+='<div class="tl">'+b.join('<br>')+'</div>';
    var pc=passChip(i); if(pc)h+='<div style="margin-top:5px">'+pc+'</div>';
    if(day.note)h+='<div class="tl muted">'+esc(day.note)+'</div>';
    if(checkin)h+=lodgeBox(st);
    h+='<div style="margin-top:9px"><button class="btn" onclick="dsOpen('+i+')" style="font-size:12px;padding:6px 11px">'+ic('map',13)+' Day sheet</button></div>';
    h+='</div>';
  });
  setView('v-days',h);
  if(idx>=0){ setTimeout(function(){ var el=$('day-today'); if(el)el.scrollIntoView({block:'start'}); },60); }
}
function lodgeBox(s){
  var h='<div style="margin-top:9px;background:#F9F5EC;border:1px solid var(--pr-hairline);border-radius:11px;padding:11px">';
  h+='<div class="between"><div style="font-weight:700;font-size:14px">'+ic('bed',14)+' Check in · '+esc(s.hotel)+'</div><span class="xs muted">'+esc(s.cost)+'</span></div>';
  h+='<div class="xs muted" style="margin-top:2px">'+fmtShort(s.in)+'–'+fmtShort(s.out)+' · Conf '+esc(s.conf)+'</div>';
  if(s.cancel)h+='<div class="xs" style="margin-top:5px;color:var(--pr-warn-text);font-weight:600">'+ic('warning',13)+' Free cancel by '+fmtDT(s.cancel)+'</div>';
  h+='<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><a class="btn" href="'+mapsUrl(s.hotel+' '+s.addr)+'" target="_blank">'+ic('pin',14)+' Map</a><a class="btn" href="tel:'+esc(s.phone)+'">'+ic('phone',14)+' Call</a></div>';
  if(s.amen&&s.amen.length){
    var AMIC={laundry:'laundry',breakfast:'coffee',soak:'pool',parking:'parking',kitchen:'kitchen'};
    var ch='';
    s.amen.forEach(function(a){
      var st = a.s===1?'background:var(--pr-ok-bg);color:var(--pr-ok-text)': a.s===2?'background:var(--pr-yellow-tint);color:var(--pr-yellow-text)':'background:var(--pr-orange-tint);color:var(--pr-orange-text)';
      ch+='<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;margin:3px 4px 0 0;'+st+'">'+ic(AMIC[a.k]||'tip',12)+' '+esc(a.t)+'</span>';
    });
    h+='<div style="margin-top:8px;border-top:1px solid var(--pr-hairline);padding-top:7px">'+ch+'</div>';
  }
  var g=guideFor(s.id); if(g&&g.tonight)h+='<div class="sm" style="margin-top:9px;border-top:1px solid var(--pr-hairline);padding-top:8px">'+ic('cheers',13)+' '+esc(g.tonight)+'</div>'; if(g)h+='<div class="btn" style="margin-top:8px;width:100%;justify-content:center" onclick="openGuide(\''+s.id+'\')">'+ic('cheers',14)+' '+esc(s.name)+' nightlife &amp; eats</div>';
  if(s.note)h+='<div class="xs muted" style="margin-top:7px">'+esc(s.note)+'</div>';
  return h+'</div>';
}

function fetchSnow(k){
  var r=D.resorts[k];
  if(isDemo()){ renderDemo(k); return; }
  $('snb-'+k).innerHTML=climoHtml(k);
  var skiDate=resortSkiDate(k);
  var u='https://api.open-meteo.com/v1/forecast?latitude='+r.lat+'&longitude='+r.lon+'&current=temperature_2m,wind_gusts_10m&hourly=snow_depth,freezing_level_height&daily=snowfall_sum,temperature_2m_max,temperature_2m_min&forecast_days=16&timezone=auto&temperature_unit=fahrenheit&wind_speed_unit=mph';
  fetch(u).then(function(x){return x.json();}).then(function(j){
    var cur='';
    if(j.current){
      var parts=[Math.round(j.current.temperature_2m)+'°F'];
      try{ var hi=j.hourly.time.indexOf(j.current.time); if(hi>=0){ var sd=j.hourly.snow_depth[hi], fl=j.hourly.freezing_level_height[hi]; if(sd!=null)parts.push('base '+Math.round(sd*39.37)+'″'); if(fl!=null)parts.push('freezing lvl '+Math.round(fl*3.281)+' ft'); } }catch(e){}
      if(j.current.wind_gusts_10m!=null)parts.push('gusts '+Math.round(j.current.wind_gusts_10m)+' mph');
      cur='<div class="xs muted" style="margin-top:8px;border-top:1px solid var(--pr-hairline);padding-top:7px">Now at the hill (live): '+parts.join(' · ')+'</div>';
      $('snp-'+k).textContent=Math.round(j.current.temperature_2m)+'°F'; $('snp-'+k).className='pill';
    }
    var lead=climoHtml(k);
    if(j.daily&&j.daily.time){ var idx=j.daily.time.indexOf(skiDate); if(idx>=0){ var sfIn=(j.daily.snowfall_sum[idx]||0)/2.54; lead='<span class="pill ok">forecast · '+fmtShort(skiDate)+'</span><div style="margin-top:6px"><b>'+(sfIn>=0.3?(sfIn<1?sfIn.toFixed(1):Math.round(sfIn))+'″ snow':'no new snow')+'</b> on your day · hi '+Math.round(j.daily.temperature_2m_max[idx])+'° / lo '+Math.round(j.daily.temperature_2m_min[idx])+'°F</div>'; } }
    $('snb-'+k).innerHTML=lead+cur;
  }).catch(function(){ if($('snp-'+k)){$('snp-'+k).textContent='typical';} });
}

function viewDoc(id){ openDB(function(){ var rq=DB.transaction('docs').objectStore('docs').get(id); rq.onsuccess=function(){ var d=rq.result; if(!d)return; var url=URL.createObjectURL(new Blob([d.blob],{type:d.type||'application/octet-stream'})); window.open(url,'_blank'); }; }); }
function delDoc(id){ if(!confirm('Remove this file?'))return; openDB(function(){ DB.transaction('docs','readwrite').objectStore('docs').delete(id).onsuccess=function(){ listDocs(); }; }); }
function rMore(){
  var h=testBanner()+'<div class="hh"><h1>More</h1></div>';
  h+='<div class="card"><h2>Crew &amp; rooming</h2>';
  (D.crew||[]).forEach(function(c){h+='<div class="between" style="padding:5px 0;border-bottom:1px solid var(--pr-hairline)"><div style="font-weight:600">'+esc(c.name)+(c.note?' <span class="xs muted">'+esc(c.note)+'</span>':'')+'</div><span class="xs muted">'+esc(c.legs)+'</span></div>';});
  if(D.rooming)h+='<div class="sm muted" style="margin-top:9px">'+esc(D.rooming)+'</div>';
  h+='</div>';
  h+='<div class="card"><h2>Document vault</h2><div class="xs muted" style="margin-bottom:8px"><b>My files</b> — stored on this phone, works offline.</div><div id="doclist" class="sm muted">…</div><label class="btn" style="margin-top:8px;cursor:pointer">＋ Add file<input type="file" hidden onchange="addDoc(this)"></label><div style="border-top:1px solid var(--pr-hairline);margin-top:12px;padding-top:10px"><div class="xs muted" style="margin-bottom:8px"><b>Trip docs</b> — built into the app, work offline on every phone.</div>'+((D.docs||[]).map(function(dd){ return '<div class="between" style="padding:6px 0;border-bottom:1px solid var(--pr-hairline)"><div class="sm" style="font-weight:600;flex:1;padding-right:8px">'+esc(dd.name)+'</div><button class="btn" onclick="openEmbDoc(\''+esc(dd.id)+'\')">Open</button></div>'; }).join('')||'<div class="sm muted">None yet.</div>')+'</div><div style="border-top:1px solid var(--pr-hairline);margin-top:12px;padding-top:10px"><div class="xs muted" style="margin-bottom:8px"><b>Crew files</b> — shared with everyone, encrypted with the trip password before upload.</div><div id="sdoclist" class="sm muted">…</div><label class="btn" style="margin-top:8px;cursor:pointer">＋ Share a file<input type="file" hidden onchange="addSharedDoc(this)"></label></div></div>';
  h+='<div class="card alertcard"><h2 style="color:var(--pr-danger-text)">'+ic('alert',13)+' Emergency</h2>'+hurtHtml()+'<div style="margin-top:10px;border-top:1px solid var(--pr-hairline);padding-top:6px"><div class="xs muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.4px">Everyone</div>'+contactRows()+'</div></div>';
  h+=emgFormCard();
  h+='<div class="card"><h2>Safety &amp; emergency</h2>'; (D.safety||[]).forEach(function(s){ h+='<div class="between" style="padding:5px 0;border-bottom:1px solid var(--pr-hairline)"><div class="sm">'+esc(s.name)+'</div>'+(s.url?'<a href="'+s.url+'" target="_blank" class="sm">open ↗</a>':'<a href="tel:'+esc(s.v)+'" class="sm" style="font-weight:700">'+esc(s.v)+'</a>')+'</div>'; }); h+='</div>';
  h+=packingCard();
  h+='<div class="card"><h2>App</h2><div class="lk" onclick="lockApp()"><div style="flex:1">Lock this phone<small>sign out — trip name &amp; password needed again</small></div><span>🔒</span></div><div class="lk" onclick="hardRefresh()"><div style="flex:1">Refresh app &amp; data<small>clear the offline cache, reload the latest now</small></div><span>⟳</span></div></div>';
  if(adminOn()){
    h+='<div class="card"><h2>🧪 Test mode (admin)</h2><div class="xs muted" style="margin-bottom:8px">Pretend it’s a different date/time. Set it to <b>Jul 4</b> to preview example storm/ski conditions on the Snow tab.</div><input class="inp" type="datetime-local" id="testInput"><div style="margin-top:8px"><button class="btn pri" onclick="setTest()">Set test time</button> <button class="btn" onclick="clearTest()">Reset to now</button></div></div>';
    h+='<div class="card"><h2>Trip access (admin)</h2><div class="xs muted">Change the trip name &amp; password: re-encrypts everything on this phone and downloads a fresh <b>trip-data.json</b>. Upload it to GitHub, share the new phrase, done. (Also how you mint a NEW trip: import that trip\u2019s plain data below first.)</div><input class="inp" id="adName" placeholder="New trip name" style="margin-top:8px"><input class="inp" id="adPw" placeholder="New trip password" style="margin-top:8px"><button class="btn pri" style="width:100%;justify-content:center;margin-top:8px" onclick="adminReEncrypt()">Re-encrypt &amp; download</button></div>';
    h+='<div class="card"><h2>Trip data (admin)</h2>'
     +'<label class="lk" style="cursor:pointer"><div style="flex:1">Import updated data<small>load a new trip-data.json</small></div><span>＋</span><input type="file" hidden accept="application/json,.json" onchange="importData(this)"></label>'
     +'<div class="lk" onclick="exportData()"><div style="flex:1">Export decrypted data<small>plain-JSON backup of everything (keep it private)</small></div><span>⬇</span></div>'
     +(localStorage.getItem('dataOverride')?'<div class="lk" onclick="resetData()"><div style="flex:1">Clear imported data<small>go back to the hosted file</small></div><span>↺</span></div>':'')
     +'<div class="lk" onclick="lockAdmin()"><div style="flex:1">Lock admin<small>hide these controls again</small></div><span>🔒</span></div>'
     +'<div class="xs muted" style="margin-top:8px">Source: '+(localStorage.getItem('dataOverride')?'imported override':'hosted trip-data.json')+'</div></div>';
  }
  h+='<div class="xs muted" style="text-align:center;padding:6px 0 10px;cursor:pointer" onclick="bumpVer()">BC Powder Run · v'+esc((D.version||'?'))+(adminOn()?' · admin on':'')+'</div>';
  setView('v-more',h); listDocs(); listSharedDocs();
}

/* ---- data import/export ---- */
function importData(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var j=JSON.parse(rd.result);localStorage.setItem('dataOverride',JSON.stringify(j));if(j.gate){toast('Encrypted data imported — reloading');setTimeout(function(){location.reload();},700);}else{D=j;toast('Plain trip data loaded (this phone only)');render('more');}}catch(e){toast('Not valid JSON');}};rd.readAsText(f);}
function exportData(){var b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trip-data.json';a.click();}
function resetData(){localStorage.removeItem('dataOverride');toast('Cleared — reloading');setTimeout(function(){location.reload();},700);}
function hardRefresh(){
  if(!confirm('Clear the offline cache and reload the latest version & data?')) return;
  toast('Refreshing…');
  var fin=function(){ location.reload(); };
  var tasks=[];
  try{ localStorage.removeItem('dataCache'); }catch(e){}
  if(window.caches){ tasks.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));})); }
  if(navigator.serviceWorker){ tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));})); }
  Promise.all(tasks).then(fin).catch(fin);
  setTimeout(fin, 2500);
}
function adminOn(){ return localStorage.getItem('admin')==='1'; }
var _vt=0;
function bumpVer(){ if(adminOn())return; _vt++; if(_vt>=5){ localStorage.setItem('admin','1'); _vt=0; toast('Admin unlocked'); rMore(); } else if(_vt>=3){ toast((5-_vt)+' more taps…'); } }
function lockAdmin(){ localStorage.removeItem('admin'); _vt=0; toast('Admin locked'); rMore(); }

/* ---- boot: load data (override > network > cache) ---- */
function showNoData(){ $('v-home').innerHTML='<div class="hh"><h1>BC Powder Run</h1></div><div class="card"><h2>Couldn’t load trip data</h2><div class="sm">This app reads <b>trip-data.json</b> from the same folder. It works once hosted (or pick the file below to load it now).</div><label class="btn pri" style="margin-top:10px;display:inline-flex;cursor:pointer">Choose trip-data.json<input type="file" hidden accept="application/json,.json" onchange="importData(this)"></label></div>'; }
async function boot(){
  var data=null, ov=localStorage.getItem('dataOverride');
  if(ov){ try{ data=JSON.parse(ov); }catch(e){} }
  if(data && !data.gate){ D=data; EMB={open:{title:(D.meta||{}).title,year:(D.meta||{}).year}}; render('home'); return; }
  if(!data){ try{ var r=await fetch('trip-data.json?v='+Date.now(),{cache:'no-store'}); if(r.ok){ data=await r.json(); localStorage.setItem('dataCache',JSON.stringify(data)); } }catch(e){} }
  if(!data){ var c=localStorage.getItem('dataCache'); if(c){ try{ data=JSON.parse(c); }catch(e){} } }
  if(!data){ showNoData(); return; }
  if(data.gate){ EMB=data; var nm=localStorage.getItem('gname'), pw=localStorage.getItem('gpw');
    if(nm&&pw){ try{ await gateTry(nm,pw); var nav=document.querySelector('.bnav'); if(nav)nav.style.display=''; render('home'); loadEmg(); return; }catch(e){} }
    showGate(); return; }
  D=data; EMB={open:{title:(D.meta||{}).title,year:(D.meta||{}).year}}; render('home');
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
boot();
</script>
